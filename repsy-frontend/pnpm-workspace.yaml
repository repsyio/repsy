# pnpm 12's approval gate for dependency install scripts (see the "--ignore-scripts" comment on
# the frontend-build stage in the root Dockerfile, and e2e/pnpm-workspace.yaml for the same choice
# made there). None of these scripts are needed for this stage's one-shot `pnpm run build:prod`:
#   - @openapitools/openapi-generator-cli: its postinstall downloads the generator JAR; the
#     Dockerfile pre-seeds it from the `openapi-jar` build stage instead, so the download is never
#     reached.
#   - esbuild: its postinstall only picks the right platform binary, which it also ships as a
#     resolved optionalDependency package, so skipping the script does not break it (same finding
#     as e2e's).
#   - @parcel/watcher, lmdb, msgpackr-extract: back Angular CLI's file watcher and persistent build
#     cache, used for repeated/incremental builds and `ng serve`. A one-shot `build:prod` needs
#     neither.
allowBuilds:
  "@openapitools/openapi-generator-cli": false
  esbuild: false
  "@parcel/watcher": false
  lmdb: false
  msgpackr-extract: false
# Security overrides for transitive dependencies (Dependabot, RPS-2392 and RPS-2462, the OS copy of
# RPS-2460). Drop an entry once every parent resolves a patched version on its own (check with
# `pnpm why <package>`).
#   - minimatch < 11.0.1 and glob 9-14.0.1: eslint, typescript-eslint, karma and @angular/build pull
#     several majors; the fix exists only in the 11.x / 14.x lines.
#   - postcss-selector-parser: @tailwindcss/typography pins 6.0.10 (same major, quadratic parsing fix).
#   - basic-ftp: reached through the openapi-generator-cli proxy agent (generation tooling only).
# minimatch 3 is deliberately NOT overridden (the ranges start at 4): karma 6.4.4 (the unit test runner,
# no newer release) and glob 7 call require('minimatch') as a function, which 11 no longer exports
# ("mm is not a function"), so forcing 11 onto them breaks `ng test`.
overrides:
  minimatch@>=4.0.0 <11.0.1: ^11.0.1
  glob@>=9.0.0 <14.0.2: ^14.0.2
  postcss-selector-parser@<6.1.5: ^6.1.5
  basic-ftp@<6.2.1: ^6.2.1
