<header
  class="header fixed top-0 z-3 flex h-11 w-full items-center border-b border-base-300 bg-base-100/95 px-3 backdrop-blur-sm sm:h-12 sm:px-5 md:px-6 lg:px-8"
>
  <div class="mx-auto flex w-full items-center justify-between gap-3">
    <div class="brand-lockup flex min-w-0 items-center gap-2">
      <a
        [href]="originHubHomeUrl"
        class="brand-lockup-link brand-lockup-mark text-base-content/70 transition-[color,opacity] hover:text-base-content focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
        aria-label="OriginHub home"
        title="OriginHub"
      >
        <img
          class="brand-lockup-icon"
          ngSrc="/assets/icons/header/collaboration-fork.png"
          width="24"
          height="24"
          alt=""
          aria-hidden="true"
        />
      </a>
      <span class="brand-lockup-separator shrink-0" aria-hidden="true"></span>
      <div class="brand-lockup-mark">
        <app-repsy-brand
          [externalHref]="originHubHomeUrl"
          [priority]="true"
          size="sm"
          [showWordmark]="false"
        />
      </div>
    </div>

    <div class="header-actions flex shrink-0 items-center gap-1 sm:gap-1.5">
      <button
        type="button"
        class="header-action-btn btn btn-ghost btn-sm btn-square text-base-content/70 hover:bg-base-200/60 hover:text-base-content"
        (click)="toggleTheme($event)"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.aria-pressed]="themeService.isDark()"
        [attr.title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (themeService.isDark()) {
          <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke-width="1.75" />
            <path
              stroke-linecap="round"
              stroke-width="1.75"
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        } @else {
          <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.75"
              d="M21 14.5A8.5 8.5 0 0 1 9.5 3.5a8.6 8.6 0 1 0 11.5 11z"
            />
          </svg>
        }
      </button>

      <a
        href="https://docs.repsy.io/"
        target="_blank"
        rel="noopener"
        class="header-action-btn btn btn-ghost btn-sm btn-square text-base-content/70 hover:bg-base-200/60 hover:text-base-content"
        aria-label="Documentation"
        title="Documentation"
      >
        <img
          class="icon-img h-[18px] w-[18px] object-contain"
          ngSrc="/assets/icons/header/doc.svg"
          height="18"
          width="18"
          alt=""
          aria-hidden="true"
        />
      </a>
    </div>
  </div>
</header>
