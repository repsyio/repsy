<div class="flex items-center gap-2">
  <label
    class="group relative inline-block h-[24px] w-[48px]"
    [class.cursor-pointer]="!disabled"
    [class.cursor-not-allowed]="disabled"
  >
    <input type="checkbox" class="peer sr-only" [checked]="checked" [disabled]="disabled" (click)="toggle()" />
    <div
      class="repsy-toggle-track absolute inset-0 rounded-full border transition-colors duration-300 ease-in-out"
      [class.border-base-content/30]="!checked"
      [class.bg-base-200]="!checked"
      [class.border-primary]="checked"
      [class.bg-primary]="checked"
      [class.group-hover:ring-2]="!disabled"
      [class.group-hover:ring-primary/40]="!disabled && checked"
      [class.group-hover:ring-base-content/25]="!disabled && !checked"
      [class.opacity-50]="disabled"
    ></div>
    <div
      class="repsy-toggle-thumb absolute top-[3px] left-[3px] h-[18px] w-[18px] rounded-full bg-base-100 shadow-sm ring-1 ring-base-content/15 transition-transform duration-300 ease-in-out"
      [class.translate-x-6]="checked"
    ></div>
  </label>
  <span class="font-sans leading-6 text-base-content/70">
    {{ staticLabel ? staticLabel : checked ? checkedLabel : uncheckedLabel }}
  </span>
</div>
