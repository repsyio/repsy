<label
  data-testid="toggle"
  class="flex items-center gap-2"
  [class.cursor-pointer]="!isDisabled"
  [class.cursor-not-allowed]="isDisabled"
>
  <span class="group relative inline-block h-[24px] w-[48px]">
    <input
      data-testid="toggle-input"
      type="checkbox"
      role="switch"
      class="peer sr-only"
      [checked]="checked"
      [disabled]="isDisabled"
      [attr.aria-checked]="checked"
      [attr.aria-labelledby]="labelledBy ? labelledBy + ' ' + labelId : null"
      (click)="toggle()"
    />
    <span
      class="absolute inset-0 rounded-full transition-colors duration-300 ease-in-out peer-focus-visible:ring-2 peer-focus-visible:ring-[#FDFDFD]"
      [class.bg-[#404141]]="!checked"
      [class.bg-secondaryBrand-600]="checked"
      [class.group-hover:ring-2]="!isDisabled"
      [class.group-hover:ring-[#9FA0A0]]="!isDisabled"
    ></span>
    <span
      class="absolute top-[4px] left-[6px] h-[16px] w-[16px] rounded-full bg-white transition-transform duration-300 ease-in-out"
      [class.translate-x-5]="checked"
    ></span>
  </span>
  <span [id]="labelId" data-testid="toggle-label" class="font-['Comfortaa'] leading-6 text-[#9FA0A0]">
    {{ staticLabel ? staticLabel : checked ? checkedLabel : uncheckedLabel }}
  </span>
</label>
