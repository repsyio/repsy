<div class="relative">
  <span #label data-testid="tooltip-text" [class]="truncate ? 'block truncate' : ''">{{ text }}</span>
  @if (showPopup) {
    <div
      role="tooltip"
      data-testid="tooltip-popup"
      animate.enter="fade-in-down"
      class="pointer-events-none absolute top-6 -left-1 z-1 w-max max-w-[150px] transform rounded-md bg-[#101112] px-2 py-1 text-sm break-all text-white shadow-md"
    >
      {{ popupText }}
    </div>
  }
</div>
