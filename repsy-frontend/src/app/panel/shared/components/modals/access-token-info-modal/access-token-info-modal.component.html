@if (open && tokenInfo) {
  <div
    data-testid="access-token-info-backdrop"
    animate.enter="fade-in-up"
    class="bg-opacity-50 fixed inset-0 z-3 backdrop-blur-sm"
    (click)="closeModal()"
    aria-hidden="true"
  ></div>

  <div
    data-testid="access-token-info-modal"
    appDialog
    #dialog="appDialog"
    (appDialogClose)="closeModal()"
    class="fixed top-1/2 left-1/2 z-4 max-h-[calc(100vh-2rem)] w-[calc(100%-2rem)] max-w-[400px] -translate-x-1/2 -translate-y-1/2 transform overflow-y-auto rounded-xl border border-[#404141] bg-[#101112] p-6 sm:max-w-[600px] sm:p-8 md:max-w-[700px] md:p-[45px]"
  >
    <div class="flex items-center justify-between">
      <h1 [id]="dialog.titleId" class="text-[24px] leading-6 text-white">Access Token Created</h1>
      <button
        data-testid="access-token-info-close"
        type="button"
        aria-label="Close dialog"
        (click)="closeModal()"
        class="hover:text-secondary-500 text-neutral-200"
      >
        <i aria-hidden="true" class="ri-close-line"></i>
      </button>
    </div>

    <div class="gradient-border mx-auto my-6 sm:my-10"></div>

    <p class="text-warning-500 pb-6 text-sm">You can only view this access token once, so be sure to save it.</p>

    <label [attr.for]="id('token')" class="mb-1 block text-[16px] text-[#9FA0A0]">Repsy Access Token</label>
    <div class="flex h-[40px] items-center gap-2 rounded-lg border border-[#404141] bg-[#101112] px-4">
      <input
        data-testid="access-token-info-token"
        [id]="id('token')"
        [type]="showToken ? 'text' : 'password'"
        [value]="tokenInfo.token"
        readonly
        class="flex-1 border-none bg-transparent pr-2 text-[14px] text-white outline-none select-all"
        style="letter-spacing: 0.1em"
      />
      <button
        data-testid="access-token-info-toggle"
        type="button"
        class="text-neutral-400 hover:text-neutral-200"
        [attr.aria-label]="showToken ? 'Hide token' : 'Show token'"
        [attr.aria-pressed]="showToken"
        (click)="toggleShowToken()"
      >
        <i aria-hidden="true" [ngClass]="{ 'ri-eye-line': showToken, 'ri-eye-off-line': !showToken }"></i>
      </button>
      <app-copy-clipboard data-testid="access-token-info-copy" [text]="tokenInfo.token" />
    </div>
  </div>
}
