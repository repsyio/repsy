@if (scanned && (isSupported$ | async)) {
  <button type="button" (click)="openModal($event)" class="cursor-pointer">
    <app-severity-badge
      [severity]="severity"
      [scanned]="scanned"
      [compact]="true"
      [attr.aria-label]="versionName + ' security status'"
    />
  </button>

  <app-version-security-modal
    [repoName]="repoName"
    [repoType]="repoType"
    [artifactName]="artifactName"
    [artifactVersion]="versionName"
    [(open)]="showModal"
  />
}
