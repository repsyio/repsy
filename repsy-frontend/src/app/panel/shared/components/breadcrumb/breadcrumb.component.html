@if (crumbs.length > 0) {
  <nav data-testid="breadcrumb" class="mb-4 text-[14px]">
    <ol class="flex flex-wrap items-center p-0">
      @for (crumbLink of crumbLinks; track crumbLink; let i = $index; let last = $last) {
        <li [attr.data-testid]="'breadcrumb-item-' + i" class="flex min-w-0 items-center">
          <!-- Last breadcrumb item (No link) -->
          @if (last) {
            <span data-testid="breadcrumb-current" class="min-w-0 break-all text-[#FDFDFD]">{{ crumbs[i] }}</span>
          } @else {
            <a
              data-testid="breadcrumb-link"
              class="min-w-0 break-all text-[#9FA0A0] hover:text-[#FDFDFD]"
              [routerLink]="crumbLink"
              >{{ crumbs[i] }}</a
            >
          }

          <!-- Separator Image -->
          @if (i < crumbLinks.length - 1) {
            <img
              ngSrc="/assets/icons/cursor/breadcrumb-split.svg"
              height="16"
              width="16"
              alt="Breadcrumb Split"
              class="mx-2 shrink-0"
            />
          }
        </li>
      }
    </ol>
  </nav>
}
