<div data-testid="repo-count-card" class="min-h-[295px] w-full rounded-[12px] border border-[#404141] bg-[#101112]">
  <!-- Repository List -->
  <div class="flex flex-col gap-[12px] p-[20px]">
    <!-- Docker Row -->
    <button
      data-testid="repo-count-row-docker"
      type="button"
      (click)="routeDocker()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-docker">{{ dockerRepoCount }}</span> / Registries are in use.
      </span>
      <span class="h-[23.48px] w-[27.09px]">
        <img ngSrc="/assets/icons/docker/docker-light.svg" alt="Docker" height="87" width="101" />
      </span>
    </button>

    <!-- Maven Row -->
    <button
      data-testid="repo-count-row-maven"
      type="button"
      (click)="routeMaven()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-maven">{{ mavenRepoCount }}</span> / Repositories are in use.
      </span>
      <span class="h-[11.81px] w-[50.58px]">
        <img ngSrc="/assets/icons/maven/maven-light.svg" alt="Maven" height="58" width="213" />
      </span>
    </button>

    <!-- NPM Row -->
    <button
      data-testid="repo-count-row-npm"
      type="button"
      (click)="routeNpm()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-npm">{{ npmRegistryCount }}</span> / Registries are in use.
      </span>
      <span class="h-[20.36px] w-[31.67px]">
        <img ngSrc="/assets/icons/npm/npm-light.svg" alt="NPM" height="84" width="141" />
      </span>
    </button>

    <!-- Python Row -->
    <button
      data-testid="repo-count-row-pypi"
      type="button"
      (click)="routePypi()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-pypi">{{ pypiRepoCount }}</span> / Repositories are in use.
      </span>
      <span class="h-[22.73px] w-[22.49px]">
        <img ngSrc="/assets/icons/pypi/pypi2-light.svg" alt="Python" height="46" width="46" />
      </span>
    </button>

    <!-- Golang Row -->
    <button
      data-testid="repo-count-row-golang"
      type="button"
      (click)="routeGolang()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-golang">{{ golangRepoCount }}</span> / Repositories are in use.
      </span>
      <span class="h-[23px] w-[32px]">
        <img ngSrc="/assets/icons/golang/golang-light.svg" alt="Go" height="23" width="60" />
      </span>
    </button>

    <!-- Cargo Row -->
    <button
      data-testid="repo-count-row-cargo"
      type="button"
      (click)="routeCargo()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-cargo">{{ cargoRepoCount }}</span> / Repositories are in use.
      </span>
      <img src="assets/icons/cargo/cargo_light.svg" width="23" height="60" alt="cargo" />
    </button>

    <!-- NuGet Row -->
    <button
      data-testid="repo-count-row-nuget"
      type="button"
      (click)="routeNuget()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-nuget">{{ nugetRepoCount }}</span> / Repositories are in use.
      </span>
      <span class="h-[24px] w-[24px]">
        <img ngSrc="/assets/icons/nuget/nuget-light.svg" alt="NuGet" height="24" width="24" />
      </span>
    </button>

    <!-- Helm Row -->
    <button
      data-testid="repo-count-row-helm"
      type="button"
      (click)="routeHelm()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-helm">{{ helmRepoCount }}</span> / Repositories are in use.
      </span>
      <span class="h-[28px] w-[28px]">
        <img ngSrc="/assets/icons/helm/helm-light.svg" alt="Helm" height="28" width="28" class="h-7 w-7" />
      </span>
    </button>

    <!-- Ruby Row -->
    <button
      data-testid="repo-count-row-ruby"
      type="button"
      (click)="routeRuby()"
      class="flex h-[43px] w-full items-center justify-between rounded-[12px] border border-[#101112] bg-linear-to-b from-[rgba(17,16,16,0.6)] to-[#1D1C1C] px-[20px] hover:border-[#404141]"
    >
      <span class="text-[13px] text-[#FDFDFD]">
        <span data-testid="repo-count-value-ruby">{{ rubyRepoCount }}</span> / Repositories are in use.
      </span>
      <span class="h-[24px] w-[24px]">
        <img ngSrc="/assets/icons/ruby/ruby-light.svg" alt="Ruby" height="24" width="24" />
      </span>
    </button>
  </div>
</div>
