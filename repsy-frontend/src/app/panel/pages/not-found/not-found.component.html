<div animate.enter="fade-in-up" class="flex min-h-[600px] items-center justify-center px-4 py-8">
  <div class="text-center">
    <!-- Hippo Image -->
    <img class="mx-auto mb-8" ngSrc="/assets/images/hippo-empty.svg" alt="Page not found" height="243" width="510" />

    <!-- 404 Text -->
    <h1 class="mb-4 text-[48px] font-bold text-base-content sm:text-[64px]">404</h1>

    <!-- Error Message -->
    <p class="mb-8 max-w-[600px] text-sm text-base-content/70 sm:text-base">
      {{ message }}
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col items-center justify-center gap-4 sm:flex-row">
      <a
        routerLink="/repositories"
        class="flex h-[40px] w-full items-center justify-center gap-2 rounded-[8px] border border-base-300 bg-transparent px-6 text-base font-bold text-base-content transition-all hover:border-primary hover:bg-base-200 sm:w-auto"
      >
        Go to Home
      </a>
    </div>
  </div>
</div>
