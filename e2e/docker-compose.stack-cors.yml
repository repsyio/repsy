# OPT-IN overlay that sets APP_ALLOWED_ORIGINS on the e2e stack (RPS-1590). The default stack leaves it
# unset, and unset means same-origin only: the panel API sends no CORS header (tests/api/cors-csp.spec.ts,
# @smoke). With it set, exactly the listed origins are allowed, with credentials, on the panel API only,
# and the CSP connect-src names them (@cors in the same spec).
#
# It is never part of the default stack: it changes nothing unless it is passed as an extra -f, which
# `./run.sh local up --cors` (or REPSY_E2E_CORS=1) does, on top of the postgres or the H2 stack:
#
#   docker compose -f docker-compose.stack.yml -f docker-compose.stack-cors.yml up -d --wait
#
# Only the @cors specs may run against it (the @smoke CORS and CSP specs assert the unset default).
# Give "down" the same flags as "up". See README.md "CORS leg". The two origins below are repeated in
# tests/api/cors-csp.spec.ts.
services:
  repsy:
    environment:
      APP_ALLOWED_ORIGINS: http://allowed.e2e.test,http://second-allowed.e2e.test
