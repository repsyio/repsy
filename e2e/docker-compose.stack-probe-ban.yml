# OPT-IN overlay that makes the probe ban as strict as it can be (RPS-2328): enforce mode and ONE
# strike to ban, so a single request that any signal of the classifier counts bans the client. Every
# runner of the e2e stack reaches Repsy from the same address (the docker gateway), so the first false
# positive refuses every request that follows it with 429 and fails the spec that sent it: a real
# client (Maven, npm, Docker, Go, NuGet, PyPI, Helm, Cargo, Ruby, the panel in a browser) that the
# probe ban would count cannot pass unnoticed. tests/stack/probe-ban.spec.ts then proves the overlay
# really bans, and that the Repsy log names no other client as a prober.
#
# It is never part of the default stack and the suites that send probes on purpose (the api runner
# sends `../x` in tests/api/maven-browser.spec.ts) must not run against it. It changes nothing unless it is passed as an
# extra -f, which `./run.sh local up --probe-ban` (or REPSY_E2E_PROBE_BAN=1) does, on top of the postgres or
# the H2 stack:
#
#   docker compose -f docker-compose.stack.yml -f docker-compose.stack-probe-ban.yml up -d --wait
#
# Give "down" the same flags as "up". See README.md "Probe-ban leg".
services:
  repsy:
    environment:
      PROBE_THROTTLE_MODE: enforce
      # One strike bans: every weighted signal is worth at least one. The ban time and the window stay
      # at their defaults (an hour): a ban in this stack is a failure, and it should stay visible.
      PROBE_THROTTLE_MAX_STRIKES: '1'
      # The root log level is WARN and only AuthFailureThrottle is raised to INFO (application.yml), so the line a
      # window's first probe writes ("sent a suspicious request", INFO) would never reach the log, and a client
      # that only a scanner User-Agent counted (strikes without a ban) would leave no trace. The package name is
      # all lower case, which the environment form of a logger name can express (a class name cannot).
      LOGGING_LEVEL_IO_REPSY_PROTOCOLS_SHARED_AUTH: INFO
