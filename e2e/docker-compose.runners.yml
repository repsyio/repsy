# The only place tests run (see README.md: runner-only execution). One service per protocol joins
# "skeleton" from step 2 onward, each `FROM` runners/base.Dockerfile plus its own client toolchain.
# network_mode: host so both a local stack (localhost:8080/9090) and a remote URL work unchanged.
# A distinct project name from docker-compose.stack.yml, or compose reports the stack's own
# containers as "orphans" of this one merely because both files would otherwise share a name.
name: repsy-e2e-runners

services:
  skeleton:
    build:
      context: .
      dockerfile: runners/base.Dockerfile
    network_mode: host
    # Runs as the invoking host user (run.sh exports HOST_UID/HOST_GID), not the image's default
    # root, so files this writes into the bind-mounted directories below (the regenerated API
    # client, test reports) are owned by that user on the host, not root.
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    environment:
      HOME: /tmp
      REPSY_API_BASE_URL: ${REPSY_API_BASE_URL:-http://localhost:8080}
      REPSY_REPO_BASE_URL: ${REPSY_REPO_BASE_URL:-http://localhost:9090}
      REPSY_ADMIN_USERNAME: ${REPSY_ADMIN_USERNAME:-admin}
      REPSY_ADMIN_PASSWORD: ${REPSY_ADMIN_PASSWORD:?Set REPSY_ADMIN_PASSWORD in e2e/.env}
      REPSY_TARGET: ${REPSY_TARGET:-local}
      REPSY_E2E_RUN_ID: ${REPSY_E2E_RUN_ID:-}
      REPSY_E2E_INSECURE_REGISTRY: ${REPSY_E2E_INSECURE_REGISTRY:-}
    volumes:
      # The openapi spec, at the same path relative to /app that gen:api's "../repsy-backend/..."
      # resolves to, so it (and any edit to it) reaches the container without a rebuild.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
