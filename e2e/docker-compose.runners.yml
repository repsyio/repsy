# The only place tests run (see README.md: runner-only execution). One service per protocol joins
# "skeleton" from step 2 onward, each `FROM` runners/base.Dockerfile plus its own client toolchain.
# network_mode: host so both a local stack (localhost:8080/9090) and a remote URL work unchanged.
# A distinct project name from docker-compose.stack.yml, or compose reports the stack's own
# containers as "orphans" of this one merely because both files would otherwise share a name.
# run.sh passes -p "<stack project>-runners" for a non-default stack project (README.md "Parallel
# stacks"), so that stack's runner images and shared Maven/Gradle caches are private to it.
name: repsy-e2e-runners

# Shared by every service below (YAML merge key, `<<: *runner-common`): only mappings (`user`,
# `environment`) merge this way, not lists, so each service still spells out its own `volumes:` in
# full rather than aliasing this block's (there is no shared list here to alias).
x-runner-common: &runner-common
  network_mode: host
  # Runs as the invoking host user (run.sh exports HOST_UID/HOST_GID), not the image's default
  # root, so files this writes into the bind-mounted directories below (the regenerated API
  # client, test reports) are owned by that user on the host, not root.
  user: '${HOST_UID:-1000}:${HOST_GID:-1000}'

x-runner-environment: &runner-environment
  HOME: /tmp
  REPSY_API_BASE_URL: ${REPSY_API_BASE_URL:-http://localhost:8080}
  REPSY_REPO_BASE_URL: ${REPSY_REPO_BASE_URL:-http://localhost:9090}
  REPSY_ADMIN_USERNAME: ${REPSY_ADMIN_USERNAME:-admin}
  REPSY_ADMIN_PASSWORD: ${REPSY_ADMIN_PASSWORD:?Set REPSY_ADMIN_PASSWORD in e2e/.env}
  REPSY_TARGET: ${REPSY_TARGET:-local}
  REPSY_E2E_RUN_ID: ${REPSY_E2E_RUN_ID:-}
  REPSY_E2E_INSECURE_REGISTRY: ${REPSY_E2E_INSECURE_REGISTRY:-}
  # Where the @scanner specs of ANY runner reach the stub scanner's /control API (the scanner overlay,
  # docker-compose.stack-scanner.yml, publishes it on loopback; every runner has the host network) and
  # the key both sides share (README.md "Scanner stack"). Read by ScannerStubClient.fromEnv().
  REPSY_SCANNER_STUB_URL: ${REPSY_SCANNER_STUB_URL:-http://localhost:${REPSY_E2E_SCANNER_PORT:-8090}}
  REPSY_SCANNER_API_KEY: ${REPSY_SCANNER_API_KEY:-e2e-scanner-key}
  # Comma list of opt-in suites (e.g. "throttle,scanner"): run.sh adds the name of every stack overlay
  # that is on (README.md "Stack overlays"). Read by optedIn() in src/stack-overlays.ts.
  REPSY_E2E_OPT_IN: ${REPSY_E2E_OPT_IN:-}

services:
  skeleton:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/base.Dockerfile
    environment:
      <<: *runner-environment
    volumes:
      # The openapi spec, at the same path relative to /app that gen:api's "../repsy-backend/..."
      # resolves to, so it (and any edit to it) reaches the container without a rebuild.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  # Raw HTTP at the edge of Repsy (tests/api, README.md "API suite"): the base image, no client toolchain.
  api:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/base.Dockerfile
    environment:
      <<: *runner-environment
    volumes:
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  maven:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/maven.Dockerfile
      args:
        TEMURIN_VERSION: '21'
        MAVEN_VERSION: '3.9.9'
        GRADLE_VERSION: '8.14.3'
        GRADLE_SHA256: 'bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531'
        ANT_VERSION: '1.10.15'
        ANT_SHA512: 'd78427aff207592c024ff1552dc04f7b57065a195c42d398fcffe7a0145e8d00cd46786f5aa52e77ab0fdf81334f065eb8011eecd2b48f7228e97ff4cb20d16c'
        IVY_VERSION: '2.5.3'
        IVY_SHA512: '19e38998eda66a635643f50eec1fe62aeaa4b66e7b12540e38ae9ab67f2402a4df1230c0fa142e391234abf8491b5cd46fa8a3b004324b511a495701be848470'
    environment:
      <<: *runner-environment
      # Read by clients/maven.ts: Maven's shared, third-party-only "local repository tail" (see that
      # file's header comment) -- never this harness's own test artifacts.
      MAVEN_SHARED_REPO_DIR: /app/.maven-shared-m2
      # Read by clients/gradle.ts: a Gradle user home primed once and copied into each Gradle run's
      # own home (see that file's SHARED_GRADLE_HOME_DIR comment) -- never a dependency of a test.
      GRADLE_SHARED_HOME_DIR: /app/.gradle-shared
    volumes:
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
      - maven_m2_shared:/app/.maven-shared-m2
      - gradle_home_shared:/app/.gradle-shared

  npm:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/npm.Dockerfile
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume: the npm test packages are dependency-free on purpose (they
      # must never let `npm install` reach the real npmjs.org for anything), so there is nothing
      # third-party to warm a cache with, unlike maven's shared .m2 tail repo.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  # The npm-family clients (pnpm, yarn classic, yarn berry, bun, plus npm as the baseline) against the
  # same npm repositories the "npm" runner tests with npm alone (tests/npm-clients, README.md
  # "npm-family clients"). Its own runner so `--protocol npm` stays exactly as small and fast as it
  # was; opt in with `--protocol npm-clients`.
  npm-clients:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/npm-clients.Dockerfile
      args:
        # Resolved live (`npm view pnpm dist-tags`, `npm view @yarnpkg/cli-dist dist-tags`,
        # `docker run --rm oven/bun:1.3-debian bun --version`); the Dockerfile fails the build when a
        # client's own `--version` differs. yarn classic is a frozen line (1.22.22 is its last release).
        PNPM_CLIENT_VERSION: '12.6.0'
        YARN_CLASSIC_VERSION: '1.22.22'
        YARN_BERRY_VERSION: '4.18.1'
        BUN_VERSION: '1.3.14'
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume, same reasoning as npm's: the test packages are dependency-free
      # apart from each other (every one lives in the repo under test), so there is nothing third-party
      # to warm a cache with. Each client invocation gets its own store/cache in an isolated HOME.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  cargo:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/cargo.Dockerfile
      args:
        RUST_VERSION: '1.98.1'
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume, same reasoning as npm's: the cargo test crates are
      # dependency-free on purpose, so there is nothing third-party for `cargo fetch` to cache.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  nuget:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/nuget.Dockerfile
      args:
        DOTNET_SDK_VERSION: '10.0.401'
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume, same reasoning as npm's/cargo's: net10.0's targeting pack
      # ships inside the SDK image itself (packs/), and this harness's test packages/projects are
      # dependency-free, so `dotnet restore` never fetches anything third-party to cache.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  docker:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/docker.Dockerfile
      args:
        CRANE_VERSION: 'v0.22.1'
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume, same reasoning as npm's/cargo's/nuget's: `crane` is a static,
      # daemonless binary with no image cache of its own (clients/docker.ts's craneEnv points
      # DOCKER_CONFIG at a fresh per-invocation directory), so there is nothing third-party to cache.
      # No docker.sock/privileged/DinD either -- see runners/docker.Dockerfile's header.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  helm:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/helm.Dockerfile
      args:
        HELM_VERSION: 'v4.3.0'
        HELM_PUSH_VERSION: '0.11.1'
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume, same reasoning as npm's/cargo's/nuget's/docker's: `helm` is a
      # static, daemonless binary with no image cache of its own (clients/helm.ts's helmEnv points
      # every HELM_* directory at a fresh per-invocation HOME), and the `cm-push` plugin is
      # installed once at build time (runners/helm.Dockerfile's header), not per test, so there is
      # nothing third-party for a test run itself to cache. No daemon/socket/DinD/cluster either --
      # helm push/pull/cm-push/registry login are pure HTTP client commands, see that file's header.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  pypi:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/pypi.Dockerfile
      args:
        PYTHON_VERSION: '3.14.7'
        PIP_VERSION: '26.2.1'
        TWINE_VERSION: '7.0.0'
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume, same reasoning as npm's/cargo's/nuget's/docker's/helm's: this
      # harness's wheel is dependency-free and hand-built (never `python -m build`), so `pip
      # download`/`twine upload` never fetch anything third-party to cache. No daemon/socket either --
      # twine/pip are pure HTTP clients (clients/pypi.ts's file header).
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  golang:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/golang.Dockerfile
      args:
        GO_VERSION: '1.27.1'
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume, same reasoning as npm's/cargo's/nuget's/docker's/helm's/pypi's:
      # this harness's module zip is dependency-free and hand-built (never `go build`/`go mod`), so
      # `go mod download` never fetches a third-party dependency to cache. No daemon/socket either --
      # `curl`/`go` are pure HTTP clients (clients/golang.ts's file header).
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  ruby:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/ruby.Dockerfile
      args:
        RUBY_VERSION: '4.0.7'
    environment:
      <<: *runner-environment
    volumes:
      # No shared/named cache volume, same reasoning as npm's/cargo's/nuget's/docker's/helm's/pypi's/
      # golang's: this harness's gem is dependency-free and hand-built (never `gem build`), so
      # `bundle install`/`gem push` never fetch a third-party dependency to cache.
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  # The "stack" runner: cases that drive the Repsy CONTAINER itself with `docker exec`/`docker logs`
  # (tests/stack/, README.md "Stack runner"). The only runner with the host's Docker socket, added
  # through group_add so the non-root host uid can use it. Local/ci stacks only.
  stack:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/stack.Dockerfile
      args:
        DOCKER_CLI_VERSION: '29.8.1'
    group_add:
      - '${DOCKER_GID:-999}'
    environment:
      <<: *runner-environment
      REPSY_E2E_STACK_PROJECT: ${REPSY_E2E_STACK_PROJECT:-repsy-e2e}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

  ui:
    <<: *runner-common
    build:
      context: .
      dockerfile: runners/ui.Dockerfile
    # Chromium's renderer keeps its shared memory in /dev/shm; Docker's 64 MB default makes tabs crash
    # under parallel workers. Sharing the host's IPC namespace (its /dev/shm) sidesteps that limit.
    ipc: host
    # Chromium's sandbox needs user namespaces, which Docker's default seccomp profile blocks for a
    # non-root uid (probed: "Chromium sandboxing failed!"). Playwright's own profile is the default
    # one plus exactly those syscalls. The relative path resolves against this file's directory.
    # REPSY_UI_NO_SANDBOX=1 (below) is the escape hatch for a kernel without unprivileged user
    # namespaces at all; see README.md "UI suite".
    security_opt:
      - seccomp=./runners/ui-seccomp.json
    environment:
      <<: *runner-environment
      # The SPA is served on the API port, so the UI base URL defaults to REPSY_API_BASE_URL.
      REPSY_UI_BASE_URL: ${REPSY_UI_BASE_URL:-${REPSY_API_BASE_URL:-http://localhost:8080}}
      # Read by playwright.config.ts; only this service sets it, so the protocol runners keep
      # Playwright's default worker count.
      REPSY_UI_WORKERS: ${REPSY_UI_WORKERS:-4}
      REPSY_UI_NO_SANDBOX: ${REPSY_UI_NO_SANDBOX:-}
      # The UI suite's own, older spelling of REPSY_E2E_OPT_IN (above); optedIn() reads both.
      REPSY_UI_OPT_IN: ${REPSY_UI_OPT_IN:-}
      # Where the @scanner specs reach the stub scanner's /control API (docker-compose.stack-scanner.yml
      # publishes it on loopback; this service has the host network) and the key both sides share.
      REPSY_SCANNER_STUB_URL: ${REPSY_SCANNER_STUB_URL:-http://localhost:${REPSY_E2E_SCANNER_PORT:-8090}}
      REPSY_SCANNER_API_KEY: ${REPSY_SCANNER_API_KEY:-e2e-scanner-key}
      # Forwarded to this service only: playwright.config.ts's isCI (retries, forbidOnly, trace mode)
      # keys off it, and forwarding it to the protocol runners would change their behaviour.
      CI: ${CI:-}
    volumes:
      # No shared/named cache volume: the browser is baked into the image (/ms-playwright).
      - ../repsy-backend/src/main/resources/openapi:/repsy-backend/src/main/resources/openapi:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report

volumes:
  # Named (not bind-mounted): holds only downloaded third-party Maven plugins/dependencies, so it
  # persists across `run.sh test` invocations without leaving anything in the working tree.
  maven_m2_shared: {}
  # Named for the same reason: the primed Gradle user home of clients/gradle.ts (native libraries,
  # generated Gradle API / Kotlin DSL jars, plugin accessors), never a resolved dependency.
  gradle_home_shared: {}
