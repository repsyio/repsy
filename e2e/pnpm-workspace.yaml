# pnpm 12's approval gate for dependency install scripts (see the "--ignore-scripts" comment in
# runners/base.Dockerfile and .github/actions/setup-pnpm for the same choice made there):
# esbuild's postinstall only downloads its own platform binary, which it also ships as a resolved
# optionalDependency package, so skipping the script does not break it (verified: pnpm gen:api,
# pnpm exec tsx and pnpm exec playwright all work without it).
allowBuilds:
  esbuild: false
# Dependabot (RPS-2392). minimatch is fixed only in 11.x (GHSA-g3hv-75wg-m249: no backport to the 3 and 10
# lines that eslint and its dependencies use), so every copy is forced to 11.
overrides:
  minimatch: ^11.0.1
