// Rendered by clients/gradle-plugin.ts (mustache) into the consumer project (the Groovy DSL). Repsy is
// the ONLY plugin repository: naming pluginManagement.repositories switches Gradle's default (the
// Gradle Plugin Portal) off, so a plugin can only be found here. `legacy` maps the plugin id to its
// jar by hand (resolutionStrategy.eachPlugin), the route that needs no plugin marker artifact.
pluginManagement {
  repositories {
    maven {
      url = uri('{{{repoUrl}}}')
      allowInsecureProtocol = true
      {{#hasCredential}}
      credentials {
        username = providers.gradleProperty('repsyUsername').get()
        password = providers.gradleProperty('repsyPassword').get()
      }
      {{/hasCredential}}
    }
  }
  {{#legacy}}
  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == '{{{pluginId}}}') {
        useModule('{{{groupId}}}:{{{artifactId}}}:{{{version}}}')
      }
    }
  }
  {{/legacy}}
}

rootProject.name = '{{{artifactId}}}-consumer'
