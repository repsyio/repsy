// Rendered by clients/gradle-consumer.ts (mustache) into a consumer project that lives for a whole
// test (the Groovy DSL): the Repsy repository only, one or more dependencies (usually a dynamic
// version such as 1.+), and optionally dependency locking, which pins what a dynamic version resolved
// to in gradle.lockfile. fetchDependencies syncs what was resolved into build/resolved.
plugins {
  id 'java-library'
}

repositories {
  maven {
    url = uri('{{{repoUrl}}}')
    allowInsecureProtocol = true
    {{#hasCredential}}
    credentials {
      username = findProperty('repsyUsername')
      password = findProperty('repsyPassword')
    }
    {{/hasCredential}}
  }
}

{{#locking}}
dependencyLocking {
  lockAllConfigurations()
  {{#strict}}
  lockMode.set(LockMode.STRICT)
  {{/strict}}
}

{{/locking}}
dependencies {
  {{#dependencies}}
  implementation '{{{.}}}'
  {{/dependencies}}
}

tasks.register('fetchDependencies', Sync) {
  from configurations.runtimeClasspath
  into layout.buildDirectory.dir('resolved')
}
