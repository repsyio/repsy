# OPT-IN overlay that runs the REAL vulnerability scanner in the e2e stack (RPS-1484): the
# repsy-scanner-trivy service, built from ../repsy-scanner-trivy with the Trivy binary in it, and Repsy
# started with SECURITY_SCANNER=enabled pointed at it. tests/api/trivy-contract.spec.ts drives it with
# the raw contract calls the stub scanner (docker-compose.stack-scanner.yml) mimics, and with one real
# scan, so the stub cannot drift from the real contract (README.md "Real scanner stack").
#
# Unlike the stub it needs the network: Trivy downloads its vulnerability database (ghcr.io, with a
# mirror.gcr.io fallback) on the first scan, and the scanner does so at start-up too. The cache is a
# named volume of the compose project, so `down` + `up` reuses it; `down -v` drops it.
#
# It is an alternative to the stub overlay, never combined with it (both publish the scanner port and
# both set the backend's scanner URL; run.sh refuses the pair):
#
#   docker compose -f docker-compose.stack.yml -f docker-compose.stack-trivy.yml up -d --wait --build
#
# The scanner is published on loopback only (REPSY_E2E_SCANNER_PORT, default 8090; run.sh adds its port
# offset), which is where the runners (host network) reach it; Repsy reaches it as scanner-trivy:8090 on
# the compose network. To pull a Docker image the scanner needs Repsy's repo port, which it reaches as
# repsy:9090 (DOCKER_INTERNAL_REGISTRY_BASE_URL, plain http so the scan is made with --insecure).
services:
  scanner-trivy:
    image: ${REPSY_TRIVY_IMAGE:-repsy-e2e-scanner-trivy:${REPSY_E2E_IMAGE_TAG:-local}}
    build:
      context: ../repsy-scanner-trivy
    ports:
      - '127.0.0.1:${REPSY_E2E_SCANNER_PORT:-8090}:8090'
    environment:
      SCANNER_API_KEY: ${REPSY_SCANNER_API_KEY:-e2e-scanner-key}
      # A scan that has to download the vulnerability database first (up to 5 attempts with a growing
      # delay inside the scanner) must not hit the scanner's own 300 s limit.
      TRIVY_TIMEOUT_SECONDS: '600'
    volumes:
      - trivy-cache:/home/appuser/.cache/trivy
    # Readiness, not /health: the scanner holds readiness while it downloads the vulnerability databases
    # (about two minutes on a cold cache), so `up --wait` returns when the first scan can run. The
    # download is retried inside the scanner and, when it still fails, the scanner starts anyway (its
    # first scan retries), so this wait ends either way.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:8090/actuator/health/readiness']
      interval: 5s
      timeout: 3s
      retries: 90
      start_period: 5s

  repsy:
    depends_on:
      scanner-trivy:
        condition: service_healthy
    environment:
      SECURITY_SCANNER: enabled
      TRIVY_SCANNER_BASE_URL: http://scanner-trivy:8090
      TRIVY_SCANNER_API_KEY: ${REPSY_SCANNER_API_KEY:-e2e-scanner-key}
      DOCKER_INTERNAL_REGISTRY_BASE_URL: http://repsy:9090
      TRIVY_POLL_INTERVAL_MS: '2000'
      # The backend gives up on a scan that runs longer than this (default 330 s): a first scan that
      # downloads the database, with the scanner's retries, needs more.
      TRIVY_MAX_SCAN_DURATION_SECONDS: '900'

volumes:
  trivy-cache:
