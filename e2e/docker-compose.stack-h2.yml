# The H2 stack profile: Repsy alone, backed by the embedded H2 database, no postgres service. See
# README.md "Stack profiles (postgres and H2)" for how this was chosen and confirmed live -- the
# root README's own documented `DB_URL` for embedded H2
# (`jdbc:h2:file:/app/data/repsy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE`) is the
# one pinned here; a `DATABASE_TO_LOWER=TRUE` variant was probed too and also works, but is not
# needed. RPS-1173 later made this the image's own ENV default too, so this explicit DB_URL is no
# longer strictly load-bearing for booting -- kept anyway, on purpose: an e2e profile should pin its
# own database explicitly rather than lean on an image default that could change, so this file stays
# correct either way that default goes. Same project name and ports as docker-compose.stack.yml, so
# the two profiles are mutually
# exclusive by construction and `run.sh local down [--h2]` tears down whichever is up. Started and
# stopped by `./run.sh local up|down --h2`; REPSY_ADMIN_PASSWORD must be set (e2e/.env, copied from
# .env.example).
# The default project; run.sh passes -p to use another one (README.md "Parallel stacks").
name: repsy-e2e

services:
  repsy:
    # The tag follows the project (run.sh sets REPSY_E2E_IMAGE_TAG), so two checkouts that build at the
    # same time do not retag each other's image; local for the default project (RPS-1422).
    image: ${REPSY_IMAGE:-repsy-os-e2e:${REPSY_E2E_IMAGE_TAG:-local}}
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      # Host ports move together with the project (run.sh --port-offset); the container's stay.
      - '${REPSY_E2E_API_PORT:-8080}:8080'
      - '${REPSY_E2E_REPO_PORT:-9090}:9090'
    environment:
      DB_URL: jdbc:h2:file:/app/data/repsy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      DB_USERNAME: repsy
      DB_PASSWORD: repsy123
      ADMIN_INITIAL_PASSWORD: ${REPSY_ADMIN_PASSWORD:?Set REPSY_ADMIN_PASSWORD in e2e/.env}
      # The panel's client snippets (docker login/pull, mvn, npm ...) print this host and port
      # (entrypoint.sh writes it into static-env.js); the image defaults to http://localhost:9090
      # whatever port the stack is published on (RPS-1314).
      REPO_BASE_URL: ${REPSY_REPO_BASE_URL:-http://localhost:9090}
      # Negative-auth scenarios (wrong password, revoked/expired token) authenticate wrong on
      # purpose; a stack this harness owns can raise the limit far above anything a run could trip
      # (see target.ts: canTuneThrottle is false for a "remote" target, which cannot do this).
      AUTH_THROTTLE_MAX_FAILURES: '100000'
      AUTH_THROTTLE_WINDOW_SECONDS: '60'
    healthcheck:
      # No actuator in this image; the SPA's static root is served once the app is fully up.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    # Deliberately no named volume for /app/data: the image declares VOLUME /app/data, so every
    # container gets a fresh anonymous volume and each `up` starts with an empty H2 database (the 9
    # default repos freshly seeded), mirroring the postgres profile's anonymous pgdata volume.
