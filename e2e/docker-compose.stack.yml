# The stack this harness starts and owns for the "local" and "ci" targets: postgres:18 (see
# README.md "Option 3: Docker Compose with PostgreSQL" for the DB_* variable names) plus Repsy
# built from the repo root Dockerfile. Set REPSY_IMAGE to test a published image instead of
# building. Started and stopped by `./run.sh local up|down`; REPSY_ADMIN_PASSWORD must be set
# (e2e/.env, copied from .env.example).
# The default project; run.sh passes -p to use another one (README.md "Parallel stacks").
name: repsy-e2e

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: repsy
      POSTGRES_USER: repsy
      POSTGRES_PASSWORD: repsy123
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repsy -d repsy']
      interval: 5s
      timeout: 5s
      retries: 30

  repsy:
    # The tag follows the project (run.sh sets REPSY_E2E_IMAGE_TAG), so two checkouts that build at the
    # same time do not retag each other's image; local for the default project (RPS-1422).
    image: ${REPSY_IMAGE:-repsy-os-e2e:${REPSY_E2E_IMAGE_TAG:-local}}
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host ports move together with the project (run.sh --port-offset); the container's stay.
      - '${REPSY_E2E_API_PORT:-8080}:8080'
      - '${REPSY_E2E_REPO_PORT:-9090}:9090'
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/repsy
      DB_USERNAME: repsy
      DB_PASSWORD: repsy123
      ADMIN_INITIAL_PASSWORD: ${REPSY_ADMIN_PASSWORD:?Set REPSY_ADMIN_PASSWORD in e2e/.env}
      # The panel's client snippets (docker login/pull, mvn, npm ...) print this host and port
      # (entrypoint.sh writes it into static-env.js); the image defaults to http://localhost:9090
      # whatever port the stack is published on (RPS-1314).
      REPO_BASE_URL: ${REPSY_REPO_BASE_URL:-http://localhost:9090}
      # Negative-auth scenarios (wrong password, revoked/expired token) authenticate wrong on
      # purpose; a stack this harness owns can raise the limit far above anything a run could trip
      # (see target.ts: canTuneThrottle is false for a "remote" target, which cannot do this).
      AUTH_THROTTLE_MAX_FAILURES: '100000'
      AUTH_THROTTLE_WINDOW_SECONDS: '60'
    healthcheck:
      # No actuator in this image; the SPA's static root is served once the app is fully up.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
