# OPT-IN overlay for the upgrade-path leg (RPS-1487, README.md "Upgrade path"): the environment of an
# installation as the PREVIOUS release documented it, so the same file is what the new image is started
# with after the upgrade. It changes nothing but the environment; the image is chosen by
# `./run.sh local up --upgrade` (REPSY_E2E_UPGRADE=1), which starts the previous release on a fresh volume
# and lets tests/stack/upgrade.spec.ts recreate the container on the freshly built image.
#
#  - STORAGE_BASE_PATH: the previous release did not default it to the volume (the image default came with
#    RPS-1401), so its documented setup set it (README of that release, "Option 1").
#  - DB_HOST, DB_PORT and DB_DATABASE: what the previous release's PostgreSQL setup used besides DB_URL. The
#    stack files set DB_URL as well, so every release picks the same database, and the new image only WARNs
#    that the three are no longer read (RPS-1423): the spec asserts that line.
#  - DOCKER_MANIFEST_LAYOUT_REPAIR_INITIAL_DELAY: the repair job of RPS-1216 starts ten minutes after
#    the application by default; five seconds let the spec wait for it. DOCKER_MANIFEST_LAYOUT_REPAIR_ENABLED
#    follows REPSY_E2E_UPGRADE_REPAIR (default true): the spec starts the image under test once with the job
#    off to prove a legacy manifest is served from its old file name, then with it on. The previous release
#    ignores both.
#
# Give "down" the same flags as "up". See README.md "Upgrade path".
services:
  repsy:
    environment:
      # The application logs at WARN by default (application.yml: root WARN), which hides the INFO lines the
      # upgrade is judged by: Flyway's migrations and the manifest layout repair's report.
      LOGGING_LEVEL_ORG_FLYWAYDB: INFO
      LOGGING_LEVEL_IO_REPSY_OS_SERVER_PROTOCOLS_DOCKER_SHARED_TAG_SERVICES: INFO
      STORAGE_BASE_PATH: /app/data/storage
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: repsy
      DOCKER_MANIFEST_LAYOUT_REPAIR_INITIAL_DELAY: PT5S
      DOCKER_MANIFEST_LAYOUT_REPAIR_ENABLED: ${REPSY_E2E_UPGRADE_REPAIR:-true}
