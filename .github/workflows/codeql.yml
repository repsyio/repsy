name: CodeQL

permissions:
  contents: read

# TEMPORARILY DISABLED for pull requests while the backlog is worked through: restore the
# commented pull_request trigger below to turn it back on. The weekly scan is unchanged.
on:
  # pull_request:
  #   branches:
  #     - main
  schedule:
    - cron: "30 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    name: Analyze GitHub Actions
    # The write scope is here, not at workflow level, so only this job holds it.
    permissions:
      contents: read
      security-events: write
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: actions
          build-mode: none
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  analyze-java:
    name: Analyze Java
    # The write scope is here, not at workflow level, so only this job holds it.
    permissions:
      contents: read
      security-events: write
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql-config.yml

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          checkout-enabled: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Install core modules
        run: mvn -B -ntp install -f core/pom.xml -DskipTests -Drat.skip=true -Dcheckstyle.skip=true

      - name: Build
        run: mvn -B -ntp -DskipTests -Dcheckstyle.skip=true -Dfmt.skip=true -Drat.skip=true package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    # The write scope is here, not at workflow level, so only this job holds it.
    permissions:
      contents: read
      security-events: write
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pin Node explicitly: CodeQL's bundled TypeScript parser needs Node >= 14
      # (ES2020 syntax like `??`), so don't depend on the runner image's default.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
