name: Format check on main

# RPS-1964: pr-checks.yml runs on pull_request only, so a formatting regression that reaches main
# (an admin merge, or two PRs that are each fine alone and not together) stayed invisible until it
# failed an unrelated PR. This job re-runs only the cheap formatting and editorconfig checks on
# every push to main. No JDK, no browser, no e2e stack, no gen:api.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-main:
    name: Format check - main
    runs-on: hetzner-md
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: There must be only one .editorconfig file
        run: |
          # core/ is a git submodule with its own .editorconfig; it's a
          # separate repo, not part of this repo's file count.
          if [ "$(find . -path './core' -prune -o -name '.editorconfig' -print | wc -l)" != "1" ]
          then
            exit 1
          fi

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v3.0.3

      - run: editorconfig-checker

      # Node and the pinned pnpm only: the formatting checks need neither the JDK nor the
      # generated API client (the e2e one is in e2e/.prettierignore).
      - name: Set up the frontend
        uses: ./.github/actions/setup-pnpm
        with:
          generate-api: "false"
          cache-generator-jar: "false"

      - name: Frontend - prettier
        working-directory: repsy-frontend
        run: pnpm run format:check

      - name: Install the e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: E2E - prettier
        working-directory: e2e
        run: pnpm exec prettier --check .
