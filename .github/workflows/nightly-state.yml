name: Nightly state

# Read-only: prints the state of the scheduled nightlies (the same check the release runs first, RPS-2740).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-state:
    runs-on: repsy-sm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Nightly state
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_GATE: ${{ vars.NIGHTLY_GATE || 'warn' }}
        run: .github/scripts/nightly-state.sh sonarcloud.yml e2e-nightly.yml
