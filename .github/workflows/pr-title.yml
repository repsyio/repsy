name: PR Title

permissions: {}

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    # Runs on the Self Hosted Runner like every other job in this repository.
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - name: Check the PR title
        shell: bash
        env:
          # Passed through env, never interpolated into the script: the title is user input.
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot pull request, title check skipped."
            exit 0
          fi
          # The release and bump pull requests of the repsy-release-bot GitHub App (RPS-2268) have
          # no Jira story of their own. Only that App has this login, so nobody else gets the skip.
          if [[ "$AUTHOR" == "repsy-release-bot[bot]" ]]; then
            echo "repsy-release-bot pull request, title check skipped."
            exit 0
          fi
          pattern='^RPS-[0-9]+(, RPS-[0-9]+)*: [^[:space:]].*$'
          if [[ "$TITLE" =~ $pattern && ! "$TITLE" =~ [[:space:]]$ && ! "$TITLE" =~ [[:cntrl:]] ]]; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error title=PR title::\"$TITLE\" must read \"RPS-1234: Description\" (several tickets: \"RPS-1, RPS-2: Description\"), one space after the colon and no trailing whitespace."
          exit 1
