name: OpenAPI generator cache

# The `Repsy frontend` job in pr-checks.yml caches the openapi-generator jar. A cache is only
# readable from the ref that saved it and from main, so PRs and merge queue entries can reuse
# the jar only if a run on main saved it. This workflow does that. The weekly run also keeps the
# entry from being evicted after 7 days without an access.

permissions:
  contents: read

# TEMPORARILY DISABLED for pushes to main while the backlog is worked through: restore the
# commented push trigger below to turn it back on. The weekly run and manual dispatch are unchanged.
on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - repsy-frontend/openapitools.json
  #     - .github/workflows/openapi-generator-cache.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  seed:
    name: Seed generator jar cache
    runs-on: warp-ubuntu-latest-x64-2x
    defaults:
      run:
        working-directory: ./repsy-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The same setup as the "Repsy frontend" job in pr-checks.yml, including the cache step whose
      # entry this job saves: on a miss gen:api downloads the jar and the post-job step saves it,
      # on a hit this only refreshes the entry's access time. The generated client itself is
      # thrown away.
      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend
