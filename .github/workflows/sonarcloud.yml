name: SonarCloud Analysis

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  # The scan runs in the "analyze" job and reads this report; a project has one analysis per
  # branch, so the frontend cannot be scanned on its own. Same steps as the "Repsy frontend" job
  # in pr-checks.yml, minus lint.
  frontend-coverage:
    name: Frontend coverage
    runs-on: warp-ubuntu-latest-x64-2x
    defaults:
      run:
        working-directory: ./repsy-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # Pinned (and without lifecycle scripts) to satisfy SonarCloud's githubactions:S6505 and S8543.
      # This is the pnpm version "Repsy frontend" in pr-checks.yml resolves to today.
      - name: Install pnpm
        run: npm install -g --ignore-scripts pnpm@12.5.1

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # The specs import the generated API client (src/generated/api, git-ignored), and the
      # generator is a Java tool that openapi-generator-cli downloads on first use.
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Generate API client
        run: pnpm run gen:api

      - name: Unit tests
        run: |
          google-chrome --version
          pnpm test --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: repsy-frontend/coverage/panel-frontend/lcov.info
          if-no-files-found: error

  analyze:
    name: Analyze main branch
    needs: frontend-coverage
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          # Checkout already ran above with fetch-depth: 0 for SonarCloud blame data;
          # setup-maven-action's own default checkout would re-shallow the repo.
          checkout-enabled: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Install core modules
        run: mvn -B -ntp install -f core/pom.xml -DskipTests -Drat.skip=true -Dcheckstyle.skip=true

      - name: Build and Verify
        run: mvn -B -ntp verify

      # Where repsy-frontend/pom.xml tells the scan to look for the lcov report. It is downloaded
      # after "Build and Verify" so that the Apache RAT check does not see it.
      - name: Download frontend coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: repsy-frontend/coverage/panel-frontend

      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        # **/*.spec.ts keeps the frontend specs out of the main sources: repsy-frontend/pom.xml
        # lists src as both sources and tests, so the two sets must be disjoint.
        run: >-
          mvn -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=repsyio_repsy
          -Dsonar.organization=repsy
          -Dsonar.exclusions=core/**,**/*.spec.ts
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
