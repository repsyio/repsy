name: E2E Nightly

# Runs the e2e harness (e2e/, README.md "CI"): the panel UI suite in headless Chromium and the
# wire-level protocol runners (real mvn/npm/cargo/... clients) against a Repsy image built from this
# checkout. NIGHTLY AND MANUAL ONLY, by the product owner's decision (RPS-1260): there is
# deliberately no pull_request, push or merge_group trigger, because PR checks are switched off in
# this repo (see pr-checks.yml and AGENTS.md "Merging to main"). Do not add one here; a PR gate is a
# separate, later decision (README.md "CI" says how to add a smoke gate).
#
# Run it by hand: gh workflow run e2e-nightly.yml [-f suite=ui] [-f protocol=maven,npm] [-f grep=@smoke] [-f h2_full=docker]
permissions:
  contents: read

on:
  schedule:
    # 01:23 UTC, off-peak and off the round hour, when scheduled runs are delayed the most.
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which legs to run: ui (panel UI, PostgreSQL), wire (protocol runners, PostgreSQL), h2 (@smoke on the embedded-H2 stack, plus the full catalog of one rotating runner), scanner (the @scanner UI specs against the stub scanner stack), throttle (the @throttle specs of the stack and ui runners against the auth-throttle stack), limits (the @limits specs of the pypi, helm, nuget, ruby, cargo, golang and api runners against the tiny-upload-limit stack) or all"
        type: choice
        options: [all, ui, wire, h2, scanner, throttle, limits]
        default: all
      protocol:
        description: "Only these runner services, comma separated (skeleton,maven,npm,npm-clients,cargo,nuget,docker,helm,pypi,golang,ruby,stack,api,ui). Empty: every runner of the chosen legs"
        type: string
        default: ""
      grep:
        description: "Playwright --grep pattern, e.g. @smoke. Empty: the whole suite (the h2 leg then keeps its default, @smoke). The scanner, throttle and limits legs ignore it and always run @scanner, @throttle and @limits"
        type: string
        default: ""
      h2_full:
        description: "The one runner whose FULL catalog the h2-full leg runs on the embedded-H2 stack (any runner name above). Empty: the runner that is next in the nightly rotation. It applies whatever the protocol input says"
        type: string
        default: ""
      keep_stack_logs:
        description: "Upload the Repsy and PostgreSQL container logs even when the run is green"
        type: boolean
        default: false

# One run at a time: the legs are heavy and a manual run must not overlap the nightly one. A run
# that arrives while another is in progress waits (only the newest waiting run is kept).
concurrency:
  group: e2e-nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Tag of the image the `image` job builds and every leg loads; run.sh then starts it as it is
  # (REPSY_IMAGE) instead of building again.
  REPSY_IMAGE: repsy-os-e2e:ci

jobs:
  # Decides which legs run, from the dispatch inputs (a scheduled run has none: everything).
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Build the leg matrix
        id: plan
        env:
          SUITE: ${{ inputs.suite || 'all' }}
          ONLY: ${{ inputs.protocol }}
          GREP: ${{ inputs.grep }}
          H2_FULL: ${{ inputs.h2_full }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, re, sys

          WIRE = "skeleton maven npm npm-clients cargo nuget docker helm pypi golang ruby stack api".split()
          # The runner whose full catalog runs on H2 tonight: one protocol runner per night, in turn
          # (the date, so every runner comes round every len(ROTATION) days). Not skeleton (the harness
          # proof), not stack (its @local-only cases already run in full in the h2 leg) and not api (its
          # 18 raw-HTTP tests are all @smoke, so the h2 leg already runs them in full).
          ROTATION = [r for r in WIRE if r not in ("skeleton", "stack", "api")]
          H2_FULL = os.environ["H2_FULL"].strip()
          h2_full_runner = H2_FULL or ROTATION[datetime.datetime.now(datetime.timezone.utc).toordinal() % len(ROTATION)]
          # leg -> (suite it belongs to, stack flag for run.sh local up, runners, default --grep, timeout,
          # REPSY_E2E_OPT_IN, whether the --grep input may replace the default)
          LEGS = {
              "ui": ("ui", "", ["ui"], "", 60, "", True),
              "wire": ("wire", "", WIRE, "", 150, "", True),
              # Embedded H2: @smoke of every runner (README.md "Scope decision"), not the catalogs.
              "h2": ("h2", "--h2", WIRE + ["ui"], "@smoke", 90, "", True),
              # One full catalog on H2 per night, rotating (README.md "CI"): @smoke alone let RPS-1385 (a
              # native CTE that broke Docker on H2 while every IT passed) through.
              "h2-full": ("h2", "--h2", [h2_full_runner], "", 60, "", True),
              # The stub scanner overlay (README.md "Scanner stack"): only the opted-in @scanner specs.
              # Never the whole ui suite there (its @mocked specs assume the scanner is off), so the
              # grep input does not apply to this leg.
              "scanner": ("scanner", "--scanner", ["ui"], "@scanner", 45, "scanner", False),
              # The auth-throttle overlay (README.md "Auth-throttle leg"): 3 failed password checks per
              # 10 s per client, so only the opted-in @throttle specs run there (any other suite would lock
              # itself out). The stack runner goes first and the ui runner LAST: AUTH-11 locks the docker
              # gateway's bucket, admin included, for the window (the step "Wait out the throttle window").
              "throttle": ("throttle", "--throttle", ["stack", "ui"], "@throttle", 30, "throttle", False),
              # The tiny-upload-limit overlay (README.md "Size-limit leg"): 64 KiB on every configurable upload
              # limit, so only the opted-in @limits specs run there (any other suite would be refused for
              # every package over 64 KiB). One over-limit push per real client: pypi, helm, nuget, ruby, cargo
              # and golang, plus the raw connector cases (chunked uploads) of the api runner.
              "limits": ("limits", "--limits", ["pypi", "helm", "nuget", "ruby", "cargo", "golang", "api"], "@limits", 60, "limits", False),
          }

          # leg -> {runner: --grep} where a runner must not take the leg's default grep ("" is the whole
          # catalog). Ignored when the grep input is given: that one is the person's choice. The stack
          # runner has no @smoke test, so `--grep @smoke` would fail it with "No tests found".
          RUNNER_GREP = {"h2": {"stack": ""}}

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          suite = os.environ["SUITE"]
          only = [p for p in re.split(r"[,\s]+", os.environ["ONLY"]) if p]
          unknown = [p for p in only if p not in WIRE + ["ui"]]
          if unknown:
              fail(f"unknown protocol(s): {', '.join(unknown)}")
          if H2_FULL and H2_FULL not in WIRE + ["ui"]:
              fail(f"unknown h2_full runner: {H2_FULL}")

          include = []
          for leg, (owner, stack, runners, default_grep, timeout, opt_in, grep_input) in LEGS.items():
              if suite not in ("all", owner):
                  continue
              # An explicit h2_full input names the runner outright; only the rotation obeys `protocol`.
              explicit = leg == "h2-full" and bool(H2_FULL)
              runners = [r for r in runners if not only or r in only or explicit]
              if not runners:
                  continue
              include.append({
                  "leg": leg,
                  "stack": stack,
                  "protocols": " ".join(runners),
                  "ui": "ui" in runners,
                  "grep": (os.environ["GREP"] if grep_input else "") or default_grep,
                  "runner_grep": {} if os.environ["GREP"] and grep_input else RUNNER_GREP.get(leg, {}),
                  "opt_in": opt_in,
                  "timeout": timeout,
              })

          if not include:
              fail("the suite and protocol inputs select no runner")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": include}) + "\n")
          print(json.dumps(include, indent=2))
          PY

  # The Repsy image, built once from this checkout with the layer cache, and handed to the legs as
  # an artifact: three legs each rebuilding it would triple the slowest step of the run.
  image:
    name: Build Repsy image
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Same restore-only cache and build context as release.yml (keep the path literal: it is part
      # of the cache version). A miss only makes the image build download the generator jar.
      - name: Restore OpenAPI generator jar
        id: openapi-jar
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/openapi-generator-cli
          key: openapi-generator-${{ runner.os }}-${{ hashFiles('repsy-frontend/openapitools.json') }}

      - name: Prepare OpenAPI generator jar build context
        env:
          CACHE_HIT: ${{ steps.openapi-jar.outputs.cache-hit }}
        run: |
          mkdir -p "$HOME/.cache/openapi-generator-cli"
          echo "OPENAPI_JAR_DIR=$HOME/.cache/openapi-generator-cli" >> "$GITHUB_ENV"
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::warning::OpenAPI generator jar cache miss: the image build will download it from Maven Central"
          fi

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-contexts: |
            openapi-jar=${{ env.OPENAPI_JAR_DIR }}
          load: true
          push: false
          tags: ${{ env.REPSY_IMAGE }}
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,scope=e2e-image,mode=max

      - name: Export the image
        run: docker save "$REPSY_IMAGE" | gzip -1 > "$RUNNER_TEMP/repsy-image.tar.gz"

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-repsy-image
          path: ${{ runner.temp }}/repsy-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  e2e:
    name: E2E ${{ matrix.leg }}
    needs: [plan, image]
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # A red leg must not hide the result of the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: e2e
    env:
      # A throwaway stack that lives for this job only, so a literal is fine. It must also satisfy
      # the panel's login form (6-50 chars, lower + upper case, a digit), or no UI test can log in.
      REPSY_ADMIN_PASSWORD: E2eAdmin-Pass1
      # Where the legs' reports are collected: e2e-artifacts/<leg>/<runner>/{junit.xml,playwright-report,test-results}
      ARTIFACTS: ${{ github.workspace }}/e2e/e2e-artifacts/${{ matrix.leg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # e2e/ runs from the checkout; the image comes from the artifact, so no submodule.
          submodules: false

      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-repsy-image
          path: ${{ runner.temp }}

      - name: Load the image
        run: gunzip -c "$RUNNER_TEMP/repsy-image.tar.gz" | docker load

      - name: Start the stack
        id: up
        env:
          STACK: ${{ matrix.stack }}
        # REPSY_IMAGE is set (workflow env), so run.sh starts the loaded image and does not build.
        # $STACK is empty (PostgreSQL profile), --h2, or an overlay flag (--scanner: PostgreSQL plus the
        # stub scanner; --throttle: PostgreSQL with the low auth-throttle limit; --limits: PostgreSQL with
        # tiny upload size limits); it is split into words
        # so an empty value passes no argument at all.
        run: |
          read -ra stack_args <<< "$STACK"
          ./run.sh local up "${stack_args[@]}"
          docker compose ls

      # The UI runner drives Chromium with its sandbox ON under a seccomp profile that allows user
      # namespaces (README.md "Chromium sandbox"). A runner whose kernel forbids unprivileged user
      # namespaces cannot do that; probe once and, only then, turn the sandbox off for this job with
      # REPSY_UI_NO_SANDBOX=1 (never a bare --no-sandbox). It is a throwaway VM running our own
      # tests against our own stack, so the sandbox adds little there, but it stays on wherever it
      # works. The outcome is written to the job summary.
      - name: Probe the Chromium sandbox
        if: matrix.ui
        run: |
          mkdir -p test-results playwright-report
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          export HOST_UID HOST_GID
          docker compose -f docker-compose.runners.yml build ui
          if docker compose -f docker-compose.runners.yml run --rm --no-deps ui \
            node --input-type=module -e "
              import { chromium } from '@playwright/test';
              const b = await chromium.launch({ chromiumSandbox: true });
              await (await b.newPage()).goto('about:blank');
              await b.close();
              console.log('chromium sandbox ok');"; then
            echo "- Chromium sandbox: on (works on this runner)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Chromium cannot use its sandbox on this runner; running the UI suite with REPSY_UI_NO_SANDBOX=1"
            echo "REPSY_UI_NO_SANDBOX=1" >> "$GITHUB_ENV"
            echo "- Chromium sandbox: OFF (REPSY_UI_NO_SANDBOX=1, the probe failed on this runner)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # One ./run.sh test per runner, because every invocation overwrites test-results/ and
      # playwright-report/ (README.md "Running"); each runner's reports are copied aside before the
      # next one starts. A red runner does not stop the others; the step fails at the end.
      - name: Run the tests
        id: tests
        env:
          PROTOCOLS: ${{ matrix.protocols }}
          GREP: ${{ matrix.grep }}
          # {runner: pattern} for the runners that must not take GREP (plan job, RUNNER_GREP); "" runs
          # the whole catalog of that runner.
          RUNNER_GREP: ${{ toJSON(matrix.runner_grep) }}
          # The opt-in suites (README.md "Stack overlays"): the name of the leg's overlay (`scanner`,
          # `throttle`, `limits`), empty elsewhere. run.sh hands it to every runner (docker-compose.runners.yml) and
          # the specs of that overlay skip without it.
          REPSY_E2E_OPT_IN: ${{ matrix.opt_in }}
          # Read by playwright.config.ts (retries: 1, forbidOnly, trace on first retry); run.sh
          # forwards it to the ui runner only. GitHub sets it already; explicit for the reader.
          CI: "true"
        run: |
          failed=0
          for protocol in $PROTOCOLS; do
            pattern="$(python3 -c 'import json, os, sys; print(json.loads(os.environ["RUNNER_GREP"]).get(sys.argv[1], os.environ["GREP"]), end="")' "$protocol")"
            grep_args=()
            if [ -n "$pattern" ]; then
              grep_args=(--grep "$pattern")
            fi
            echo "::group::$protocol"
            ./run.sh test --target ci --protocol "$protocol" "${grep_args[@]}" || failed=1
            mkdir -p "$ARTIFACTS/$protocol"
            cp -a test-results "$ARTIFACTS/$protocol/test-results" || true
            cp -a playwright-report "$ARTIFACTS/$protocol/playwright-report" || true
            mv "$ARTIFACTS/$protocol/test-results/junit.xml" "$ARTIFACTS/$protocol/junit.xml" || true
            echo "::endgroup::"
          done
          exit "$failed"

      # A test that only passed on its retry is a flake to ticket. The job summary lists them, but a
      # list in a summary is easy to miss, so each one also becomes a warning annotation on the run.
      # It is its own step: workflow commands are ignored in the step whose stdout is redirected into
      # the summary. Playwright keeps a directory per retry attempt (`<test>-retry1`), and only the ui
      # runner retries (CI reaches it alone, playwright.config.ts retries: isCI ? 1 : 0). The leg
      # stays green: a retry is a warning, not a verdict (RPS-1485).
      - name: Flag the tests that needed a retry
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          python3 - <<'PY'
          import glob, os

          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          base = os.environ["ARTIFACTS"]
          flaky = 0
          for folder in sorted(glob.glob(f"{base}/*/")):
              runner = os.path.basename(folder.rstrip("/"))
              for path in sorted(glob.glob(f"{folder}test-results/*-retry[0-9]*")):
                  flaky += 1
                  print(f"::warning title=Flaky test::{escape(runner)}: {escape(os.path.basename(path))} ran a retry attempt (flaky test, or a failing one)")
          print(f"{flaky} retried test(s)")
          PY

      # The specs of an overlay (@scanner, @throttle, @limits) skip themselves unless the opt-in reached the runner,
      # and a skipped test is not a failure, so a broken opt-in would leave the leg green with everything
      # skipped. Fail it instead when a runner of an overlay leg ran nothing or skipped anything.
      - name: Check the opt-in specs ran
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && matrix.opt_in != '' }}
        env:
          PROTOCOLS: ${{ matrix.protocols }}
          OPT_IN: ${{ matrix.opt_in }}
        run: |
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          bad = False
          for runner in os.environ["PROTOCOLS"].split():
              path = os.path.join(os.environ["ARTIFACTS"], runner, "junit.xml")
              try:
                  cases = list(ET.parse(path).getroot().iter("testcase"))
              except (OSError, ET.ParseError) as e:
                  print(f"::error::no readable junit.xml for {runner} in the {os.environ['OPT_IN']} leg ({e})")
                  bad = True
                  continue
              skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
              if not cases or skipped:
                  print(f"::error::{runner} ran {len(cases)} tests and skipped {len(skipped)} in the {os.environ['OPT_IN']} leg: its @{os.environ['OPT_IN']} specs must all run (REPSY_E2E_OPT_IN={os.environ['OPT_IN']})")
                  bad = True
              else:
                  print(f"{runner}: {len(cases)} @{os.environ['OPT_IN']} tests ran, none skipped")
          sys.exit(1 if bad else 0)
          PY

      # AUTH-11 (the last runner of the throttle leg) makes 30 bad logins from the docker gateway's
      # address, which is also the address of the harness's own admin logins, so that bucket stays
      # locked for the rest of the window (10 s). The leak check below logs in as admin: wait it out.
      - name: Wait out the throttle window
        if: ${{ !cancelled() && matrix.leg == 'throttle' }}
        run: sleep 12

      # Fails the leg when a run left e2e-* repos or users behind. --dry-run prints
      # "[dry-run] would delete ..." for each and always exits 0, so read its output.
      - name: Leak check
        id: leaks
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: |
          out="$(./run.sh sweep --all --dry-run 2>&1)"
          echo "$out"
          if grep -q '^\[dry-run\] would delete' <<< "$out"; then
            echo "::error::the run left e2e-* repositories or users behind (listed above)"
            exit 1
          fi

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          LEG: ${{ matrix.leg }}
          LEAKS: ${{ steps.leaks.outcome }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, os
          import xml.etree.ElementTree as ET

          base = os.environ["ARTIFACTS"]
          print(f"### E2E `{os.environ['LEG']}`\n")
          print("| runner | tests | passed | failed | skipped | wall time (s) | retried |")
          print("| --- | ---: | ---: | ---: | ---: | ---: | ---: |")
          failures, retried, totals = [], [], [0, 0, 0, 0]
          for folder in sorted(glob.glob(f"{base}/*/")):
              name = os.path.basename(folder.rstrip("/"))
              try:
                  root = ET.parse(f"{folder}junit.xml").getroot()
              except (OSError, ET.ParseError):
                  print(f"| {name} | no junit.xml: the runner did not finish | | | | | |")
                  failures.append(f"{name}: no junit.xml (the runner crashed or could not start)")
                  continue
              n = f = s = 0
              for case in root.iter("testcase"):
                  n += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      f += 1
                      failures.append(f"{name}: {case.get('name')}")
                  elif case.find("skipped") is not None:
                      s += 1
              # Playwright keeps a directory per retry attempt. A test that needed one is a flake to
              # ticket, even when it passed the second time.
              retries = sorted(
                  os.path.basename(p.rstrip("/"))
                  for p in glob.glob(f"{folder}test-results/*-retry[0-9]*")
              )
              retried += [f"{name}: {r}" for r in retries]
              secs = float(root.get("time") or 0)
              print(f"| {name} | {n} | {n - f - s} | {f} | {s} | {secs:.0f} | {len(retries)} |")
              for i, v in enumerate((n, n - f - s, f, s)):
                  totals[i] += v
          print(f"| **total** | {totals[0]} | {totals[1]} | {totals[2]} | {totals[3]} | | {len(retried)} |")
          if failures:
              print("\n**Failing tests**\n")
              for line in failures[:50]:
                  print("- " + line.replace("|", "\\|"))
              if len(failures) > 50:
                  print(f"- ... and {len(failures) - 50} more (see the junit.xml artifacts)")
          if retried:
              print("\n**Needed a retry (flake candidates)**\n")
              for line in retried[:50]:
                  print("- " + line)
          print("\nLeak check: " + {"success": "clean", "failure": "LEFTOVER e2e-* repos/users"}.get(
              os.environ["LEAKS"], "not run"))
          PY

      - name: Collect the stack logs
        if: ${{ !cancelled() && (failure() || inputs.keep_stack_logs) }}
        env:
          STACK: ${{ matrix.stack }}
        run: |
          # run.sh knows which compose files a stack has, so this step needs no list of them.
          read -ra stack_args <<< "$STACK"
          mkdir -p stack-logs
          ./run.sh local ps "${stack_args[@]}" > stack-logs/ps.txt 2>&1 || true
          ./run.sh local logs "${stack_args[@]}" > stack-logs/stack.log 2>&1 || true

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # HTML report, junit.xml, and per failed test the trace, screenshot and video.
          name: e2e-${{ matrix.leg }}-results
          path: e2e/e2e-artifacts/${{ matrix.leg }}
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the stack logs
        if: ${{ !cancelled() && (failure() || inputs.keep_stack_logs) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-${{ matrix.leg }}-stack-logs
          path: e2e/stack-logs
          retention-days: 7
          if-no-files-found: warn

      # The runner VM is discarded anyway; this only keeps a self-hosted runner (E2E_RUNNER) clean.
      - name: Stop the stack
        if: always()
        env:
          STACK: ${{ matrix.stack }}
        run: |
          read -ra stack_args <<< "$STACK"
          ./run.sh local down "${stack_args[@]}"
