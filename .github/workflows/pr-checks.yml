name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  # The merge queue on main builds every queued PR on top of the ones ahead of it and reports
  # these same checks. Without this trigger, queued entries never get a result and time out.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-checks:
    name: Editorconfig check - All
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: There must be only one .editorconfig file
        run: |
          # core/ is a git submodule with its own .editorconfig; it's a
          # separate repo, not part of this repo's file count.
          if [ "$(find . -path './core' -prune -o -name '.editorconfig' -print | wc -l)" != "1" ]
          then
            exit 1
          fi

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v3.0.3

      - run: editorconfig-checker

  java-checks:
    name: Repsy check
    runs-on: warp-ubuntu-latest-x64-2x
    # The SonarCloud scan below reads the frontend coverage report the frontend job produces (there
    # is one analysis per project, so the scan cannot be split per language). The two jobs run in
    # parallel; the scan step waits for the report, which is long done by the time the Java build
    # ends. "actions: read" lets that wait list the artifacts and jobs of this run.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          # Checkout already ran above with fetch-depth: 0 for SonarCloud blame data;
          # setup-maven-action's own default checkout would re-shallow the repo.
          checkout-enabled: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Install core modules
        run: mvn -B -ntp install -f core/pom.xml -DskipTests -Drat.skip=true -Dcheckstyle.skip=true

      - name: Build and Verify
        run: mvn -B -ntp verify

      # The frontend job runs beside this one and normally uploads its report within a minute. Wait
      # for it (at most 10 minutes), but stop as soon as that job has finished without one, that
      # is when it failed. A missing report only skips the scan; the frontend job is the red check
      # then, so a Java result is never hidden behind it. Read by the two steps below.
      - name: Wait for the frontend coverage
        id: frontend-report
        continue-on-error: true
        if: >-
          github.actor != 'dependabot[bot]'
          && github.event_name != 'merge_group'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          has_report() {
            gh api "$RUN_API/artifacts" --jq '.artifacts[].name' | grep -qx frontend-coverage
          }
          for _ in $(seq 60); do
            has_report && exit 0
            status=$(gh api "$RUN_API/jobs" --jq '.jobs[] | select(.name == "Repsy frontend") | .status')
            if [ "$status" = completed ]; then
              has_report && exit 0
              echo "::warning::The frontend job finished without a coverage report; skipping the SonarCloud scan."
              exit 1
            fi
            sleep 10
          done
          echo "::warning::The frontend coverage report did not appear in 10 minutes; skipping the SonarCloud scan."
          exit 1

      # Where repsy-frontend/pom.xml tells the scan to look for the lcov report. It is downloaded
      # after "Build and Verify" so that the Apache RAT check does not see it.
      - name: Download frontend coverage
        if: steps.frontend-report.outcome == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: repsy-frontend/coverage/panel-frontend

      - name: Analyze with SonarCloud
        # The wait step only runs (and so only succeeds) where a scan makes sense: Dependabot-
        # triggered and fork runs don't receive regular repo secrets, so SONAR_TOKEN is empty and
        # the scanner is rejected, and merge queue runs would analyse a gh-readonly-queue/* branch
        # that no PR owns (sonarcloud.yml analyses main right after the merge anyway).
        if: steps.frontend-report.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        # **/*.spec.ts keeps the frontend specs out of the main sources: repsy-frontend/pom.xml
        # lists src as both sources and tests, so the two sets must be disjoint.
        run: >-
          mvn -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=repsyio_repsy
          -Dsonar.organization=repsy
          -Dsonar.exclusions=core/**,**/*.spec.ts
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: error

  repsy-frontend:
    name: Repsy frontend
    runs-on: warp-ubuntu-latest-x64-2x
    defaults:
      run:
        working-directory: ./repsy-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node, a pinned pnpm, the dependencies and the generated API client
      # (the specs import src/generated/api). Shared with sonarcloud.yml and
      # openapi-generator-cache.yml, and the generator jar cache is defined there too.
      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend

      - name: Check
        run: pnpm run lint

      # Karma needs a Chrome binary; the runner image ships google-chrome. The CI launcher in
      # karma.conf.cjs adds --no-sandbox. A failing spec makes ng test exit non-zero. The coverage
      # report (lcov.info) is what the SonarCloud scan in the "Repsy check" job reads.
      - name: Unit tests
        run: |
          google-chrome --version
          pnpm test --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - name: Deliberate failure (throwaway test of RPS-1095)
        run: exit 1

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: repsy-frontend/coverage/panel-frontend/lcov.info
          if-no-files-found: error
