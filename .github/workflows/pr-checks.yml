name: PR Checks

permissions:
  contents: read

# TEMPORARILY DISABLED while the backlog is worked through: the pull_request and merge_group
# triggers are commented out, so PRs and the merge queue get no result from this workflow. Merge
# with `gh pr merge --squash --admin`. Restore the block below to turn the checks back on.
on:
  # pull_request:
  #   branches:
  #     - main
  # # The merge queue on main builds every queued PR on top of the ones ahead of it and reports
  # # these same checks. Without this trigger, queued entries never get a result and time out.
  # merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-checks:
    name: Editorconfig check - All
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: There must be only one .editorconfig file
        run: |
          # core/ is a git submodule with its own .editorconfig; it's a
          # separate repo, not part of this repo's file count.
          if [ "$(find . -path './core' -prune -o -name '.editorconfig' -print | wc -l)" != "1" ]
          then
            exit 1
          fi

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v3.0.3

      - run: editorconfig-checker

  java-checks:
    name: Repsy check
    runs-on: warp-ubuntu-latest-x64-2x
    # The SonarCloud scan below reads the frontend coverage report the frontend job produces (there
    # is one analysis per project, so the scan cannot be split per language). This starts the Java
    # build after the frontend job, and skips it when the frontend job fails. That PR is red anyway.
    needs: repsy-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          # Checkout already ran above with fetch-depth: 0 for SonarCloud blame data;
          # setup-maven-action's own default checkout would re-shallow the repo.
          checkout-enabled: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Install core modules
        run: mvn -B -ntp install -f core/pom.xml -DskipTests -Drat.skip=true -Dcheckstyle.skip=true

      - name: Build and Verify
        run: mvn -B -ntp verify

      # Where repsy-frontend/pom.xml tells the scan to look for the lcov report. It is downloaded
      # after "Build and Verify" so that the Apache RAT check does not see it.
      - name: Download frontend coverage
        if: >-
          github.actor != 'dependabot[bot]'
          && github.event_name != 'merge_group'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage
          path: repsy-frontend/coverage/panel-frontend

      - name: Analyze with SonarCloud
        # Dependabot-triggered and fork runs don't receive regular repo secrets, so SONAR_TOKEN is
        # empty and the scanner is rejected. Merge queue runs would analyse a gh-readonly-queue/*
        # branch that no PR owns, and sonarcloud.yml analyses main right after the merge anyway.
        if: >-
          github.actor != 'dependabot[bot]'
          && github.event_name != 'merge_group'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        # **/*.spec.ts keeps the frontend specs out of the main sources: repsy-frontend/pom.xml
        # lists src as both sources and tests, so the two sets must be disjoint.
        run: >-
          mvn -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=repsyio_repsy
          -Dsonar.organization=repsy
          -Dsonar.exclusions=core/**,**/*.spec.ts
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: error

  repsy-frontend:
    name: Repsy frontend
    runs-on: warp-ubuntu-latest-x64-2x
    defaults:
      run:
        working-directory: ./repsy-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # Pinned (and without lifecycle scripts) to satisfy SonarCloud's githubactions:S6505 and S8543.
      # Keep it on the same pnpm version as "Frontend coverage" in sonarcloud.yml.
      - name: Install pnpm
        run: npm install -g --ignore-scripts pnpm@12.5.1

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Check
        run: pnpm run lint

      # The specs import the generated API client (src/generated/api, git-ignored), and the
      # generator is a Java tool that openapi-generator-cli downloads on first use.
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "25"
          distribution: "temurin"

      # openapi-generator-cli downloads the generator jar from Maven Central the first time it
      # runs, so keep it in a cache and a Maven Central outage cannot fail this required check.
      # openapitools.json pins the version and the storage directory. This cache is only
      # readable from main and from this PR, so openapi-generator-cache.yml seeds it from main.
      - name: Cache OpenAPI generator jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/openapi-generator-cli
          key: openapi-generator-${{ runner.os }}-${{ hashFiles('repsy-frontend/openapitools.json') }}

      - name: Generate API client
        run: pnpm run gen:api

      # Karma needs a Chrome binary; the runner image ships google-chrome. The CI launcher in
      # karma.conf.cjs adds --no-sandbox. A failing spec makes ng test exit non-zero. The coverage
      # report (lcov.info) is what the SonarCloud scan in the "Repsy check" job reads.
      - name: Unit tests
        run: |
          google-chrome --version
          pnpm test --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: repsy-frontend/coverage/panel-frontend/lcov.info
          if-no-files-found: error
