name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-checks:
    name: Editorconfig check - All
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # RPS-2265: the self-hosted runners keep their workspace, and the checkout that drops the core
      # submodule leaves its old directory behind ("unable to rmdir 'core'"), with a second
      # .editorconfig and stale build output. Delete this step once every runner has run it.
      - name: Remove the former core submodule checkout
        run: rm -rf core

      - name: There must be only one .editorconfig file
        run: |
          if [ "$(find . -name '.editorconfig' -print | wc -l)" != "1" ]
          then
            exit 1
          fi

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        with:
          version: v3.0.3

      - run: editorconfig-checker


  java-checks:
    name: Java check - All
    # RPS-1453: the integration tests of repsy-backend, about nine tenths of the build, run in
    # several test JVMs at once (see "Build and Verify" below) and are CPU-bound, so this job uses
    # the 4x runner: about the same vCPU-minutes per run as the 2x runner took for the 14 minutes
    # of the serial build, in a bit more than half the time.
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    # The SonarCloud scan below reads the frontend coverage report the frontend job produces (there
    # is one analysis per project, so the scan cannot be split per language). The two jobs run in
    # parallel; the scan step waits for the report, which is long done by the time the Java build
    # ends. "actions: read" lets that wait list the artifacts and jobs of this run.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # RPS-2265: the self-hosted runners keep their workspace, and the checkout that drops the core
      # submodule leaves its old directory behind ("unable to rmdir 'core'"), with a second
      # .editorconfig and stale build output. Delete this step once every runner has run it.
      - name: Remove the former core submodule checkout
        run: rm -rf core

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@5d4481650d2563723ad6c5e8f009ac8fd746e3e8 # v1.22.0
        with:
          # Checkout already ran above with fetch-depth: 0 for SonarCloud blame data;
          # setup-maven-action's own default checkout would re-shallow the repo.
          checkout-enabled: false
          # The JDK step below owns the Temurin JDK and the Maven cache; without these two the
          # action installs Zulu and keeps a second ~/.m2 cache.
          cache-enabled: false
          java-distribution: temurin

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      # it.fork.count is the number of test JVMs the integration tests of repsy-backend are spread
      # over: one per vCPU of the runner, each with a postgres:18 container of its own
      # (AbstractIntegrationTest), so none shares a database. No -T: apache-rat-plugin 0.18 is not
      # thread-safe and fails a parallel reactor with a ConcurrentModificationException (RPS-1849).
      - name: Build and Verify
        run: mvn -B -ntp verify -Dit.fork.count=4

      # The frontend job runs beside this one and normally uploads its report within a minute. Wait
      # for it (at most 10 minutes), but stop as soon as that job has finished without one, that
      # is when it failed. A missing report only skips the scan; the frontend job is the red check
      # then, so a Java result is never hidden behind it. Read by the two steps below.
      - name: Wait for the frontend coverage
        id: frontend-report
        continue-on-error: true
        # RPS-1877: SonarCloud is disabled until the codebase refactoring is done. A skipped wait
        # leaves its outcome at "skipped", which also skips the download and the scan below.
        # To re-enable, restore the condition: github.actor != 'dependabot[bot]' && the head repo
        # equals github.repository.
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          has_report() {
            gh api "$RUN_API/artifacts" --jq '.artifacts[].name' | grep -qx frontend-coverage
          }
          for _ in $(seq 60); do
            has_report && exit 0
            status=$(gh api "$RUN_API/jobs" --jq '.jobs[] | select(.name == "Node check - All") | .status')
            if [ "$status" = completed ]; then
              has_report && exit 0
              echo "::warning::The frontend job finished without a coverage report; skipping the SonarCloud scan."
              exit 1
            fi
            sleep 10
          done
          echo "::warning::The frontend coverage report did not appear in 10 minutes; skipping the SonarCloud scan."
          exit 1

      # Where repsy-frontend/pom.xml tells the scan to look for the lcov report. It is downloaded
      # after "Build and Verify" so that the Apache RAT check does not see it.
      - name: Download frontend coverage
        if: steps.frontend-report.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: repsy-frontend/coverage/panel-frontend

      - name: Analyze with SonarCloud
        # The wait step only runs (and so only succeeds) where a scan makes sense: Dependabot-
        # triggered and fork runs don't receive regular repo secrets, so SONAR_TOKEN is empty and
        # the scanner is rejected (sonarcloud.yml analyses main on a schedule).
        if: steps.frontend-report.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        # **/*.spec.ts keeps the frontend specs out of the main sources: repsy-frontend/pom.xml
        # lists src as both sources and tests, so the two sets must be disjoint.
        run: >-
          mvn -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=repsyio_repsy
          -Dsonar.organization=repsy
          -Dsonar.exclusions=**/*.spec.ts
          -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/**'
          if-no-files-found: error

  repsy-frontend:
    name: Node check - All
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./repsy-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node, a pinned pnpm, the dependencies and the generated API client
      # (the specs import src/generated/api). Shared with sonarcloud.yml and
      # openapi-generator-cache.yml, and the generator jar cache is defined there too.
      - name: Set up the frontend
        uses: ./.github/actions/setup-pnpm

      - name: Check
        run: pnpm run lint

      # ng lint does not run prettier over src/**/*.{ts,html,css,scss}, so drift would land
      # unnoticed without this step.
      - name: Check formatting
        run: pnpm run format:check

      # Prettier for the e2e suite. It needs neither the JDK nor gen:api nor Chrome: the generated
      # client is in e2e/.prettierignore. pnpm is already installed by the setup step above.
      # --ignore-scripts and --frozen-lockfile as in the setup action (githubactions:S6505, S8543).
      - name: Install the e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check e2e formatting
        working-directory: e2e
        run: pnpm exec prettier --check .

      # Karma needs a Chrome binary; the Self Hosted Runners ship none, so "Set up Chrome" installs it
      # and Karma finds it through CHROME_BIN. The CI launcher in
      # karma.conf.cjs adds --no-sandbox. A failing spec makes ng test exit non-zero. The coverage
      # report (lcov.info) is what the SonarCloud scan in the "Java check - All" job reads.
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          install-dependencies: true

      - name: Unit tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          "$CHROME_BIN" --version
          pnpm test --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-coverage
          path: repsy-frontend/coverage/panel-frontend/lcov.info
          if-no-files-found: error
