version: 2

updates:
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows; a composite action's own `uses:` pins need their
    # directory listed to stay fresh.
    directories:
      - "/"
      - "/.github/actions/setup-frontend"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # io.repsy.core:* (the core-* artifacts) is the core submodule's own
      # groupId — it's built from the core/ directory and already has its
      # own Dependabot maven updates in the repsyio/repsy-core repository.
      - dependency-name: "io.repsy.core:*"

  # repsy-scanner-trivy is not in the root reactor and has its own parent
  # (spring-boot-starter-parent), so the "/" entry above never reads its pom.xml.
  - package-ecosystem: "maven"
    directory: "/repsy-scanner-trivy"
    schedule:
      interval: "weekly"
    groups:
      scanner-maven-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/repsy-frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on the Java 25 LTS line; only patch/minor tag bumps are proposed.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # Stay on the Node 24 LTS line; only patch/minor tag bumps are proposed.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/repsy-scanner-trivy"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
