          description: >-
            Status of the version's newest scan. Severity and findingCount always describe the
            newest COMPLETED scan, so anything other than COMPLETED here means a rescan is still
            pending, queued or running, or failed, and those numbers are the last known ones. Only
            set on the per-version summary; absent on the per-artifact summary, which spans
            several versions. A version without a completed scan is listed as well, with scanned
            false, no severity, a findingCount of 0 and the status of its newest scan.
          "$ref": "#/components/schemas/ScanStatus"
          nullable: true
        rescanInProgressCount:
          description: >-
            Number of versions of the artifact whose newest scan is pending, queued or running
            while an earlier scan of the same version completed, so severity and findingCount
            still include that version's last known result. Only set on the per-artifact summary;
            absent on the per-version summary, which has latestScanStatus instead.
          type: integer
          format: int32
        rescanFailedCount:
          description: >-
            Number of versions of the artifact whose newest scan failed while an earlier scan of
            the same version completed, so severity and findingCount still include that version's
            last known result. Only set on the per-artifact summary; absent on the per-version
            summary, which has latestScanStatus instead.
          type: integer
          format: int32
        unscannedInProgressCount:
          description: >-
            Number of versions of the artifact that have no completed scan yet and whose newest
            scan is pending, queued or running, so they are not part of severity and findingCount.
            scanned stays false while none of the artifact's versions has a completed scan. Only
            set on the per-artifact summary; absent on the per-version summary, which has
            latestScanStatus instead.
          type: integer
          format: int32
        unscannedFailedCount:
          description: >-
            Number of versions of the artifact that have no completed scan yet and whose newest
            scan failed, so they are not part of severity and findingCount. scanned stays false
            while none of the artifact's versions has a completed scan. Only set on the
            per-artifact summary; absent on the per-version summary, which has latestScanStatus
            instead.
          type: integer
          format: int32
