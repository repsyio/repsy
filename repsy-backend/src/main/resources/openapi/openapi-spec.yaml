---
openapi: 3.1.0
info:
  title: Repsy Panel API
  version: 0.1.0
  description: >-
    The API the Repsy web panel talks to (the wire protocols of the package formats are not
    described here).


    **This API is in beta.** Breaking changes are allowed until 1.0, and the version above is
    bumped for each one. It is independent of the Repsy release version.


    A successful response body is the bare resource: no envelope. A create answers 201 with a
    `Location` header, a delete or an update with nothing to return answers 204. A failed request is answered with an RFC 9457 problem document,
    `application/problem+json`, described by `ProblemDetail`: `status`, `title`, `detail`,
    `instance`, `code` (the stable key of the failure), `traceId` (the unique id of the failure)
    and, for a validation failure, `errors`.


    Authenticate with the access token that `login` returns, as `Authorization: Bearer <token>`.
    Operations that act on one repository (`/api/repos/{repoName}/...` and the per-format
    `/api/{format}/...` routes) also accept HTTP Basic with a username and password, which is meant
    for scripts. Public repositories can be read without credentials.
security:
  - bearerAuth: []
paths:
  # region: auth
  "/api/auth/tokens/refresh":
    post:
      tags:
        - auth
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenForm"
        required: true
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: "`no-store`, the response carries a secret"
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Refresh access token using a refresh token
      description: |-
        A refresh token can be used once. A successful refresh marks the presented token as used
        and returns a new pair whose refresh token belongs to the same token family. Presenting a
        token that was already used (or whose family is revoked) again is a replay: it answers 401
        `refreshTokenExpired` and revokes every refresh token of that family, so the newer token
        of the same session stops working too. A password or username change also ends the older
        refresh tokens of the user (401 `refreshTokenExpired`), and a refresh never extends the
        session past its original end.
  "/api/auth/login":
    post:
      tags:
        - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginForm"
        required: true
      security: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: "`no-store`, the response carries a secret"
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Authenticate user and return JWT tokens
  "/api/auth/logout":
    post:
      tags:
        - auth
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenForm"
        required: true
      security: []
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Revoke the refresh token family of the session the refresh token belongs to
  # region: users
  "/api/users/{userId}":
    put:
      tags:
        - users
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserUpdateForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      summary: Update a user
    delete:
      tags:
        - users
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      summary: Delete a user
  "/api/users/admin-count":
    get:
      tags:
        - users
      operationId: countAdmins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      summary: Count the users that hold the admin role, regardless of any paging or search
  "/api/users":
    get:
      tags:
        - users
      operationId: listUsers
      description: >-
        Sortable by `createdAt`, `username` (`property,direction`). The default is `createdAt,desc`.
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Only users whose username contains this text, case-insensitive.
          schema:
            type: string
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PagedModelUserResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      summary: List all users
    post:
      tags:
        - users
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserCreateForm"
        required: true
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The URL of the created user, `/api/users/{userId}`
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      summary: Create a new user
  "/api/users/{userId}/actions/reset-password":
    post:
      tags:
        - users
      operationId: resetPassword
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The new password, as a JSON string
          headers:
            Cache-Control:
              description: "`no-store`, the response carries a secret"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      summary: Reset a user's password
  # region: profile
  "/api/profile/username":
    patch:
      tags:
        - profile
      operationId: updateUsername
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateUsernameForm"
        required: true
      responses:
        '200':
          description: >-
            The new token pair: the change bumps the token version, so the tokens of the request
            stop working and the caller continues with these.
          headers:
            Cache-Control:
              description: "`no-store`, the response carries a secret"
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Update the current user's username
  "/api/profile/password":
    patch:
      tags:
        - profile
      operationId: updatePassword
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordForm"
        required: true
      responses:
        '200':
          description: >-
            The new token pair: the change bumps the token version, so the tokens of the request
            stop working and the caller continues with these.
          headers:
            Cache-Control:
              description: "`no-store`, the response carries a secret"
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Update the current user's password
  "/api/profile":
    get:
      tags:
        - profile
      operationId: getProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProfileInfo"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Get the current user's profile
    delete:
      tags:
        - profile
      operationId: deleteProfile
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Delete the current user's account
  "/api/profile/access-tokens/current":
    get:
      tags:
        - access-tokens
      operationId: getCurrentAccessToken
      description: >-
        Who the access token of the request belongs to, what it may do and until when. It is the
        route for a client that authenticates with a personal access token (see the
        `personalAccessToken` security scheme), which asks it what it is. The answer carries the
        owner, the name, the scopes, `expirationDate` and `lastUsedAt` of the token. It answers 400
        `notAnAccessToken` for the access token of a login, and 401 for anything that is neither
        (a personal access token sent as Basic credentials included).
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccessTokenWhoAmI"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Get the personal access token the request is authenticated with
  "/api/profile/access-tokens/{tokenId}":
    delete:
      tags:
        - access-tokens
      operationId: revokeAccessToken
      description: >-
        Revokes the token at once. A token of another user is a 404, as is one that is already gone.
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
      summary: Revoke a personal access token
    parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  "/api/profile/access-tokens":
    get:
      tags:
        - access-tokens
      operationId: listAccessTokens
      description: >-
        The personal access tokens of the current user. Sortable by `id`, `name`, `expirationDate`,
        `lastUsedAt`, `createdAt` (`property,direction`). The default is `id,desc`.
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PagedModelAccessTokenListItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: List the personal access tokens of the current user
    post:
      tags:
        - access-tokens
      operationId: createAccessToken
      description: >-
        Creates a personal access token for the current user. The secret is in the response and
        nowhere else: only its hash is stored, so it cannot be shown again. The answer is 400 when
        the expiration date is in the past (`accessTokenExpirationInPast`) or more than 365 days
        ahead by UTC calendar day (`accessTokenExpirationTooLate`), and when the user already holds
        50 tokens that have not expired (`accessTokenLimitReached`); an expired token does not count.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccessTokenForm"
        required: true
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              description: "`no-store`, the response carries a secret"
              schema:
                type: string
            Location:
              description: >-
                The URL of the created token, `/api/profile/access-tokens/{tokenId}`. Only DELETE is
                served there; there is no token detail route.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccessTokenCreated"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Create a personal access token
  # region: repos
  "/api/repos/{repoName}/settings":
    get:
      tags:
        - repos
      operationId: getRepoSettings
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepoSettingsInfo"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Get settings for a repository
    put:
      tags:
        - repos
      operationId: updateRepoSettings
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepoSettingsForm"
        required: true
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Update repository settings
      description: >-
        Settings are updated field by field: a field that is omitted (or sent as null) keeps its
        current value, so a client may send only the fields it wants to change.
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/repos":
    get:
      tags:
        - repos
      operationId: listRepos
      description: >-
        Lists the repositories of every type, one page at a time. Open to every authenticated
        user. Bearer token only (Basic authentication is not accepted).


        Answers 400 `validationError` for an unknown `type`, a `page` below 0, a `size` outside 1-100
        or a `sort` property that is not allowed; `data` names the parameter.


        Sortable by `createdAt`, `name`, `type`, `diskUsage` (`property,direction`). The default is
        `createdAt,desc`.
      parameters:
        - name: type
          in: query
          required: false
          description: Only repositories of this type. Case-insensitive.
          schema:
            "$ref": "#/components/schemas/RepoType"
        - name: q
          in: query
          required: false
          description: >-
            Only repositories whose name contains this text, case-insensitive. The characters
            `%`, `_` and `\` match themselves.
          schema:
            type: string
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PagedModelRepoListInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: List repositories, filtered by type and name
    post:
      tags:
        - repos
      operationId: createRepository
      description: >-
        Creates a repository of the type given in the body and returns it. Admin only (403
        `accessDenied` for any other role). Bearer token only (Basic authentication is not
        accepted).


        Answers 400 `validationError` for a missing or unknown `type` or an invalid name or
        description, `invalidRequest` for a name with characters outside `a-z A-Z 0-9 _ -`, and
        `repoNameReserved` for a name the panel reserves; 409 `repoExists` when the name is taken by
        a repository of any type.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepoCreateRequest"
        required: true
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: The URL of the created repository, `/api/repos/{repoName}`
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepoListInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      summary: Create a new repository
  "/api/repos/counts":
    get:
      tags:
        - repos
      operationId: getRepoCounts
      description: >-
        The number of repositories of each type. Every type is a key, zero included. Open to every
        authenticated user. Bearer token only (Basic authentication is not accepted).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepoCounts"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Count the repositories of each type
  "/api/repos/{repoName}/contents":
    get:
      tags:
        - repos
      operationId: getPathContent
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      security:
        - { }
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/StorageItemInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: List contents of a repository
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/repos/{repoName}":
    get:
      tags:
        - repos
      operationId: getRepo
      description: >-
        One repository: its name, description, type (the format), visibility, disk usage and
        creation time. A public repository may be read anonymously; a private one needs read
        access (404 for a caller who may not know it exists).
      security:
        - { }
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepoListInfo"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Get a repository
    patch:
      tags:
        - repos
      operationId: updateRepo
      description: >-
        Renames the repository and/or changes its description. A field that is omitted (or sent as
        null) keeps its current value; a description is cleared by sending an empty string. Answers
        the repository as it is after the update, so a client that renamed it reads the new name
        from the body. Needs the MANAGE permission.


        Answers 400 `validationError` for an invalid name or description, `invalidRequest` for a
        name with characters outside `a-z A-Z 0-9 _ -`, and `repoNameReserved` for a name the
        panel reserves; 409 `repoExists` when the new name is taken.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepoUpdateForm"
        required: true
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RepoListInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      summary: Rename a repository or change its description
    delete:
      tags:
        - repos
      operationId: deleteRepo
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      summary: Delete a repository
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  # region: repo-tokens
  "/api/repos/{repoName}/deploy-tokens/{tokenId}":
    delete:
      tags:
        - deploy-tokens
      operationId: revokeDeployToken
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Delete a deploy token
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/repos/{repoName}/deploy-tokens/{tokenId}/actions/rotate":
    post:
      tags:
        - deploy-tokens
      operationId: rotateDeployToken
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: "`no-store`, the response carries a secret"
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Regenerate a deploy token
    parameters:
