          type: string
  "/api/repos/{repoName}/docker/cleanup-policy":
    get:
      tags:
        - docker-cleanup-policy
      operationId: getDockerCleanupPolicy
      description: >-
        The cleanup policy of a Docker repository. A disabled default policy is created on the
        first read, so nothing is ever deleted until a policy is enabled. Fails with 400
        (`repoScopeNotMatched`) when the repository is not a Docker repository.
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CleanupPolicyItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      summary: The cleanup policy of a Docker repository
    put:
      tags:
        - docker-cleanup-policy
      operationId: updateDockerCleanupPolicy
      description: >-
        Replaces the rules of the cleanup policy. The policy must be enabled (400
        `cleanupPolicyDisabled`). A tag is deleted when its name matches `nameRegex` (the whole
        name), it is older than `keepDays`, it does not match `nameRegexKeep`, it is not `latest`
        and it is not one of the `keepLastN` newest tags of its image. The untagged manifests of the
        cleaned images that are older than `keepDays`, and the layers only they used, are deleted
        with them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CleanupPolicyForm"
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CleanupPolicyItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      summary: Replace the rules of the cleanup policy
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/repos/{repoName}/docker/cleanup-policy/status":
    patch:
      tags:
        - docker-cleanup-policy
      operationId: updateDockerCleanupPolicyStatus
      description: >-
        Enables or disables the cleanup policy. Enabling makes the policy due at once, so the next
        scheduler pass runs it. Disabling clears `nextRunAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
