components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The access token returned by `login` or `refreshToken`. Every operation needs it unless it
        says `security: []` (public), or lists an empty requirement next to `bearerAuth` (readable
        anonymously when the repository is public, otherwise it needs the token).
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index. The default is 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size, 1 to 100. The default is 10.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Sort order as `property,direction` (`asc` or `desc`); repeat the parameter for more than one
        property. The properties a paged operation accepts differ (the operation lists them), and
        any other one is answered with 400 `validationError`. Ties are broken by id, so the pages of
        one query never repeat or skip a row.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
  responses:
    BadRequest:
      description: >-
        The request is malformed or fails validation: a body that cannot be read or breaks a
        constraint, a missing or mistyped parameter, a page below 0, a size outside 1-100 or a
        sort property that is not allowed (`validationError`, `data` names the offending parameter
        where there is one), or a business rule (for example `usernameInUse` or
        `cannotDeleteLastAdminUser`).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: >-
        The request is not authenticated: the token or credentials are missing, wrong or expired,
        or the account behind the token no longer exists. `msgId` says which
        (`sessionExpired`: refresh the access token once and retry; `unAuthorized`,
        `accessNotAllowed`, `refreshTokenExpired`, `invalidCredentials`: the session or the
        credentials are not valid, sign in again). The panel answers with a `WWW-Authenticate:
        Bearer` challenge.


        A signed-in user who merely lacks the permission is never answered 401: that is a 403
        `accessDenied`, and the session stays valid (RPS-1284).
      headers:
        WWW-Authenticate:
          description: The `Bearer` challenge, sent by the panel operations.
          schema:
            type: string
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        The caller is signed in but is not allowed to do this: the admin role is required
        (`accessDenied`). Every operation that manages a repository (settings, usage, description,
        rename, delete, deploy tokens, key stores, deleting packages and versions, creating a
        repository) answers a user who is not an admin with this status, whether or not the
        repository exists. The session stays valid.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: >-
        The thing the request names does not exist: a repository (`repoNotFound`), a repository
        type, a user, a token or an item in the repository (`itemNotFound`). A caller who may not
        use the repository is answered 401 or 403 instead, so this does not reveal that it exists.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: >-
        The request collides with something that exists (`itemAlreadyExists`, `repoExists`,
        `keyStoreAlreadyExists`, `pgpPublicKeyAlreadyExists`, `scanAlreadyRunning`).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: >-
        The client made too many failed password checks and is refused until its window ends
        (`tooManyRequests`). The answer is the same whatever username or password was sent.
      headers:
        Retry-After:
          description: Seconds until the client may try again
          schema:
            type: integer
            format: int64
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    NuGetDependencyInfo:
      type: object
      properties:
        packageId:
          type: string
        versionRange:
          type: string
        targetFramework:
          type: string
      required:
        - packageId
        - versionRange
    NuGetPackageListItem:
      type: object
      properties:
        packageId:
          type: string
        latestVersion:
          type: string
        description:
          type: string
        totalDownloads:
          type: integer
          format: int64
      required:
        - packageId
        - totalDownloads
    NuGetVersionListItem:
      type: object
      properties:
        version:
          type: string
        publishedAt:
          type: string
          format: date-time
        downloads:
          type: integer
          format: int64
        prerelease:
          type: boolean
          nullable: false
        listed:
          type: boolean
          nullable: false
      required:
        - version
        - publishedAt
        - downloads
        - prerelease
        - listed
    NuGetPackageInfo:
      type: object
      properties:
        packageId:
          type: string
        title:
          type: string
        description:
          type: string
        authors:
          type: string
        tags:
          type: string
        iconUrl:
          type: string
        licenseUrl:
          type: string
        projectUrl:
          type: string
        latestVersion:
          type: string
        totalDownloads:
          type: integer
          format: int64
      required:
        - packageId
        - totalDownloads
    NuGetVersionInfo:
      type: object
      properties:
        packageId:
          type: string
        version:
          type: string
        title:
          type: string
        description:
          type: string
        authors:
          type: string
        tags:
          type: string
        iconUrl:
          type: string
        licenseUrl:
