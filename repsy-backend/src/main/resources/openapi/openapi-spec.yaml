          type: string
        text:
          type: string
    PagedModelNuGetPackageListItem:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/NuGetPackageListItem"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    RestResponsePagedModelNuGetPackageListItem:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
          "$ref": "#/components/schemas/PagedModelNuGetPackageListItem"
        errorCode:
          type: string
        text:
          type: string
    PagedModelNuGetVersionListItem:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/NuGetVersionListItem"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    RestResponsePagedModelNuGetVersionListItem:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
          "$ref": "#/components/schemas/PagedModelNuGetVersionListItem"
        errorCode:
          type: string
        text:
          type: string
    UserUpdateForm:
      type: object
      properties:
        username:
          type: string
          maxLength: 25
          minLength: 3
          pattern: "^[a-z0-9_\\-]+$"
        role:
          "$ref": "#/components/schemas/UserRole"
      required:
        - username
        - role
    RestResponseUserResponse:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
          "$ref": "#/components/schemas/UserResponse"
        errorCode:
          type: string
        text:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          "$ref": "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          # null until the first login; keep it in the JSON as an explicit null
          x-jackson-json-include-policy: NONE
      required:
        - id
        - username
        - role
        - createdAt
        - lastLoginAt
    RepoInfo:
      type: object
      properties:
        storageKey:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        diskUsage:
          type: integer
          format: int64
        privateRepo:
          type: boolean
          nullable: false
        snapshots:
          type: boolean
          nullable: false
        releases:
          type: boolean
          nullable: false
        allowOverride:
          type: boolean
          nullable: false
        searchable:
          type: boolean
          nullable: false
        securityScanEnabled:
          type: boolean
          nullable: false
          description: >-
            Whether newly pushed versions are scanned automatically. Manually triggered scans ignore
            this setting.
        type:
          "$ref": "#/components/schemas/RepoType"
    RepoSettingsForm:
      type: object
      description: >-
        Settings are updated field by field: a field that is omitted (or sent as null) keeps its
        current value, so a client may send only the fields it wants to change.
      properties:
        privateRepo:
          type: boolean
          nullable: false
        allowOverride:
          type: boolean
          nullable: false
        releases:
          type: boolean
          nullable: false
          description: >-
            Maven and NuGet only; rejected with 400 releasesSnapshotsUnsupported for any other repo
            type. When false, uploads of release versions are refused, including redeploys of
            release versions that already exist.
        snapshots:
          type: boolean
          nullable: false
          description: >-
            Maven and NuGet only; rejected with 400 releasesSnapshotsUnsupported for any other repo
            type. When false, uploads of snapshot versions are refused, including redeploys of
            snapshot versions that already exist.
        securityScanEnabled:
          type: boolean
          nullable: false
          description: >-
            Whether newly pushed versions are scanned automatically. Manually triggered scans ignore
            this setting.
        pgpVerifyAllSignaturesEnabled:
          type: boolean
          nullable: false
          description: >-
            Maven only; rejected with 400 pgpSettingsUnsupported for any other repo type. When true,
            every artifact signature (.jar.asc, -sources.jar.asc, .module.asc, ...) is verified
            against the file it signs before it is stored, exactly like the .pom.asc, and a version
            is signed only when every file of it has a verified signature. When false (the default)
            only the .pom.asc is verified.
        pgpKeyServerLookupEnabled:
          type: boolean
          nullable: false
          description: >-
            Maven only; rejected with 400 pgpSettingsUnsupported for any other repo type. When
            false, a signature made with a key that is not registered on the repository is refused
            with 404 artifactSigningKeyNotRegistered, without asking any public key server (for
            installs that cannot reach the internet). Defaults to true.
    RestResponseVoid:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data: { }
        errorCode:
          type: string
        text:
          type: string
    RestResponseString:
