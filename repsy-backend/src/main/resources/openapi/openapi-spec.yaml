      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    UntaggedManifestCleanupResult:
      type: object
      properties:
        deletedManifests:
          type: integer
          format: int32
          description: Manifests deleted (rows and files).
        freedManifestBytes:
          type: integer
          format: int64
          description: Bytes of the manifest files deleted, already refunded to the repository usage.
        orphanLayersScheduled:
          type: integer
          format: int32
          description: Layers deleted from the database whose blobs are being deleted in the background.
        orphanLayerBytes:
          type: integer
          format: int64
          description: Sum of the sizes of those layers; refunded to the usage as the blobs go.
    ImageListItem:
      type: object
      description: >-
        An image of a Docker repo. An image is kept while it stores any manifest, so it may have no
        tags: then tagCount is 0, digest is null and size is 0 (both describe what the tags reach),
        and the untagged fields say what it still stores.
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
          description: >-
            Size of the distinct layers the tagged manifests reach, through indexes of any depth.
        digest:
          type: string
          description: Digest of the manifest the most recently moved tag points at; null without tags.
        updatedAt:
          type: string
          format: date-time
          description: Latest tag creation; the last change of the image when it has no tag.
        tagCount:
          type: integer
          format: int32
          description: Number of tags of the image.
        untaggedManifestCount:
          type: integer
          format: int32
          description: >-
            Manifests that no tag points at and no tagged index lists, directly or through other
            indexes to any depth: what "Delete untagged manifests" removes.
        untaggedSize:
          type: integer
          format: int64
          description: >-
            Size of the distinct layers (config blobs included) that untagged manifests link to and
            no manifest a tag reaches (through indexes of any depth) links to. For an image without
            tags, all it stores.
