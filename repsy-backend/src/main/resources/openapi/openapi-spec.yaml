---
openapi: 3.1.0
info:
  title: Repsy Panel API
  version: 0.1.0
  description: >-
    The API the Repsy web panel talks to (the wire protocols of the package formats are not
    described here).


    **This API is in beta.** Breaking changes are allowed until 1.0, and the version above is
    bumped for each one. It is independent of the Repsy release version.


    Every response body, success or failure, is the same envelope: `msgId`, `type`, `text`,
    `errorCode` and `data`. Failures are described by `ErrorResponse`.


    Authenticate with the access token that `login` returns, as `Authorization: Bearer <token>`.
    Operations that act on one repository (`/api/repos/{repoName}/...` and the per-format
    `/api/{format}/...` routes) also accept HTTP Basic with a username and password, which is meant
    for scripts. Public repositories can be read without credentials.
security:
  - bearerAuth: []
paths:
  "/api/users/{userId}":
    put:
      tags:
        - user-controller
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserUpdateForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseUserResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      summary: Update a user
    delete:
      tags:
        - user-controller
      operationId: deleteUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseVoid"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      summary: Delete a user
  "/api/repos/{repoName}/settings":
    get:
      tags:
        - protocol-repo-controller
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseRepoSettingsInfo"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Get settings for a repository
    put:
      tags:
        - protocol-repo-controller
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepoSettingsForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseVoid"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Update repository settings
      description: >-
        Settings are updated field by field: a field that is omitted (or sent as null) keeps its
        current value, so a client may send only the fields it wants to change.
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/repos/{repoName}/deploy-tokens/{tokenId}":
    put:
      tags:
        - protocol-deploy-token-controller
      operationId: rotate
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseString"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Regenerate a deploy token
    delete:
      tags:
        - protocol-deploy-token-controller
      operationId: revoke
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseVoid"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Delete a deploy token
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/profile/username":
    put:
      tags:
        - profile-controller
      operationId: updateUsername
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateUsernameForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseLoginInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Update the current user's username
  "/api/profile/password":
    put:
      tags:
        - profile-controller
      operationId: updatePassword
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseLoginInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Update the current user's password
  "/api/users/admin-count":
    get:
      tags:
        - user-controller
      operationId: countAdmins
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseLong"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      summary: Count the users that hold the admin role, regardless of any paging or search
  "/api/users":
    get:
      tags:
        - user-controller
      operationId: listUsers
      description: >-
        Sortable by `createdAt`, `username` (`property,direction`). The default is `createdAt,desc`.
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Only users whose username contains this text, case-insensitive.
          schema:
            type: string
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponsePagedModelUserResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      summary: List all users
    post:
      tags:
        - user-controller
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserCreateForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseUserResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
      summary: Create a new user
  "/api/users/{userId}/actions/reset-password":
    post:
      tags:
        - user-controller
      operationId: resetPassword
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseString"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
      summary: Reset a user's password
  "/api/repos":
    get:
      tags:
        - repo-collection-controller
      operationId: listRepos
      description: >-
        Lists the repositories of every type, one page at a time. Open to every authenticated
        user. Bearer token only (Basic authentication is not accepted).


        Answers 400 `validationError` for an unknown `type`, a `page` below 0, a `size` outside 1-100
        or a `sort` property that is not allowed; `data` names the parameter.


        Sortable by `createdAt`, `name`, `type`, `diskUsage` (`property,direction`). The default is
        `createdAt,desc`.
      parameters:
        - name: type
          in: query
          required: false
          description: Only repositories of this type. Case-insensitive.
          schema:
            "$ref": "#/components/schemas/RepoType"
        - name: q
          in: query
          required: false
          description: >-
            Only repositories whose name contains this text, case-insensitive. The characters
            `%`, `_` and `\` match themselves.
          schema:
            type: string
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponsePagedModelRepoListInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: List repositories, filtered by type and name
    post:
      tags:
        - repo-collection-controller
      operationId: createRepository
      description: >-
        Creates a repository of the type given in the body and returns it. Admin only (403
        `accessDenied` for any other role). Bearer token only (Basic authentication is not
        accepted).


        Answers 400 `validationError` for a missing or unknown `type` or an invalid name or
        description, `invalidRequest` for a name with characters outside `a-z A-Z 0-9 _ -`, and
        `repoNameReserved` for a name the panel reserves; 409 `repoExists` when the name is taken by
        a repository of any type.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepoCreateRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseRepoListInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
      summary: Create a new repository
  "/api/repos/counts":
    get:
      tags:
        - repo-collection-controller
      operationId: getRepoCounts
      description: >-
        The number of repositories of each type. Every type is a key, zero included. Open to every
        authenticated user. Bearer token only (Basic authentication is not accepted).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseRepoCounts"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Count the repositories of each type
  "/api/repos/{repoName}/deploy-tokens":
    get:
      tags:
        - protocol-deploy-token-controller
      operationId: listDeployTokens
      description: >-
        Sortable by `id`, `name`, `username`, `description`, `readOnly`, `expirationDate`, `createdAt`
        (`property,direction`). The default is `id,desc`.
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponsePagedModelDeployTokenInfoListItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: List deploy tokens for a repository
    post:
      tags:
        - protocol-deploy-token-controller
      operationId: createDeployToken
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeployTokenForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseTokenInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Create a deploy token for a repository
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/mvn/key-stores/allowed-servers":
    get:
      tags:
        - key-store-controller
      operationId: listAllowedKeyServers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseListAllowedKeyserverItem"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: List allowed keyservers for the authenticated user
  "/api/mvn/key-stores/{repoName}":
    get:
      tags:
        - key-store-controller
      operationId: listMavenKeyStores
      description: >-
        Sortable by `id`, `host`, `displayName` (`property,direction`). The default is `id,desc`.
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponsePagedModelKeyStoreItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: List key stores for a Maven repository
    post:
      tags:
        - key-store-controller
      operationId: createMavenKeyStore
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/KeyStoreForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseKeyStoreItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Add a key store to a Maven repository
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/mvn/key-stores/{repoName}/public-keys":
    get:
      tags:
        - key-store-controller
      operationId: listMavenPgpPublicKeys
      parameters:
        - "$ref": "#/components/parameters/Page"
        - "$ref": "#/components/parameters/Size"
        - "$ref": "#/components/parameters/Sort"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponsePagedModelPgpPublicKeyItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: List the PGP public keys registered directly on a Maven repository's key store
      description: >-
        Registered keys are tried first when a .pom.asc is verified, then the repo's allowed
        key-server hosts, then the two public default servers. A signature whose key is nowhere
        among those is refused with 404 and nothing is stored.


        Sortable by `id`, `keyId`, `fingerprint`, `userId`, `createdAt` (`property,direction`). The
        default is `id,desc`.
    post:
      tags:
        - key-store-controller
      operationId: createMavenPgpPublicKey
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PgpPublicKeyForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponsePgpPublicKeyItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Register an armored OpenPGP public key directly on a Maven repository's key store
      description: >-
        Registered keys are tried first when a .pom.asc is verified, then the repo's allowed
        key-server hosts, then the two public default servers. A signature whose key is nowhere
        among those is refused with 404 and nothing is stored.
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/mvn/key-stores/{repoName}/public-keys/{publicKeyId}":
    delete:
      tags:
        - key-store-controller
      operationId: deleteMavenPgpPublicKey
      parameters:
        - name: publicKeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseVoid"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Remove a registered PGP public key from a Maven repository's key store
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/auth/tokens/refresh":
    post:
      tags:
        - auth-controller
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenForm"
        required: true
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseLoginInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Refresh access token using a refresh token
  "/api/auth/login":
    post:
      tags:
        - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginForm"
        required: true
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseLoginInfo"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Authenticate user and return JWT tokens
  "/api/repos/{repoName}/name":
    patch:
      tags:
        - protocol-repo-controller
      operationId: rename
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepoRenameForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseVoid"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Rename a repository
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/repos/{repoName}/description":
    patch:
      tags:
        - protocol-repo-controller
      operationId: updateDescription
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RepoDescriptionForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseVoid"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Update repository description
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/usages":
    get:
      tags:
        - usage-controller
      operationId: getTotalUsage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseTotalUsageInfo"
        '401':
          "$ref": "#/components/responses/Unauthorized"
      summary: Get total usage statistics
  "/api/repos/{repoName}/usage":
    get:
      tags:
        - protocol-repo-controller
      operationId: getUsage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseRepoUsageInfo"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Get storage usage for a repository
    parameters:
      - name: repoName
        in: path
        required: true
        schema:
          type: string
  "/api/repos/{repoName}/permissions":
    get:
      tags:
        - protocol-repo-controller
      operationId: getPermission
      security:
        - { }
