components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The access token returned by `login` or `refreshToken`. Every operation needs it unless it
        says `security: []` (public), or lists an empty requirement next to `bearerAuth` (readable
        anonymously when the repository is public, otherwise it needs the token), or lists
        `personalAccessToken` next to it, which is then accepted in its place.
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        A personal access token (`rut-...`), issued by `createAccessToken` and sent as `Authorization:
        Bearer <token>`. An operation that accepts it lists it next to `bearerAuth` in its
        `security`: the operations on a repository (every path with `{repoName}`), `listRepos`,
        `createRepo` and `getCurrentAccessToken`. Every other operation takes the access token of a
        login only, so a personal access token cannot change a password or a username, and cannot
        create, list or revoke tokens (it answers 401).


        What a token may do is the permission of its owner intersected with its scopes:
        `repo:read` reads, `repo:write` also writes, and `repo:manage` also manages, which is the
        permission of an ADMIN, so it gives nothing to a user who is not one. A token that is
        signed in but may not do an operation is answered 403 `accessDenied`, and an unknown,
        expired or revoked token 401. Repeated unknown or expired tokens count against the client
        like wrong passwords and are answered 429.
  parameters:
    # region: shared
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index. The default is 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size, 1 to 100. The default is 10.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Sort order as `property,direction` (`asc` or `desc`); repeat the parameter for more than one
        property. The properties a paged operation accepts differ (the operation lists them), and
        any other one is answered with 400 `validationError`. Ties are broken by id, so the pages of
        one query never repeat or skip a row.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    # region: docker
    DockerImage:
      name: image
      in: query
      required: false
      description: >-
        The full name of a Docker image whose name has several segments (`team/app`). Pass `-` as
        `{imageName}` then. Without it, `{imageName}` is the name.
      schema:
        type: string
  responses:
    # region: shared
    BadRequest:
      description: >-
        The request is malformed or fails validation: a body that cannot be read or breaks a
        constraint, a missing or mistyped parameter, a page below 0, a size outside 1-100 or a
        sort property that is not allowed (`validationError`, `data` names the offending parameter
        where there is one), or a business rule (for example `usernameInUse` or
        `cannotDeleteLastAdminUser`).
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: >-
        The request is not authenticated: the token or credentials are missing, wrong or expired,
        or the account behind the token no longer exists. `msgId` says which
        (`sessionExpired`: refresh the access token once and retry; `loginRequired`,
        `accessNotAllowed`, `refreshTokenExpired`, `invalidCredentials`: the session or the
        credentials are not valid, sign in again). The panel answers with a `WWW-Authenticate:
        Bearer` challenge.


        A signed-in user who merely lacks the permission is never answered 401: that is a 403
        `accessDenied`, and the session stays valid (RPS-1284).
      headers:
        WWW-Authenticate:
          description: The `Bearer` challenge, sent by the panel operations.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/ProblemDetail"
    Forbidden:
      description: >-
        The caller is signed in but is not allowed to do this: the admin role is required
        (`accessDenied`). Every operation that manages a repository (settings, usage, description,
        rename, delete, deploy tokens, key stores, deleting packages and versions, creating a
        repository) answers a user who is not an admin with this status, whether or not the
        repository exists. The session stays valid.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/ProblemDetail"
    NotFound:
      description: >-
        The thing the request names does not exist: a repository (`repoNotFound`), a repository
        type, a user, a token or an item in the repository (`itemNotFound`). A caller who may not
        use the repository is answered 401 or 403 instead, so this does not reveal that it exists.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/ProblemDetail"
    Conflict:
      description: >-
        The request collides with something that exists (`itemAlreadyExists`, `repoExists`,
        `keyStoreAlreadyExists`, `pgpPublicKeyAlreadyExists`, `scanAlreadyRunning`), or with another
        request that changed the same item at the same moment (`concurrentModification`): read the
        item again and repeat the request.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: >-
        The client made too many failed password checks and is refused until its window ends
        (`tooManyRequests`). The answer is the same whatever username or password was sent.
      headers:
        Retry-After:
          description: Seconds until the client may try again
          schema:
            type: integer
            format: int64
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/ProblemDetail"
    ServiceUnavailable:
      description: >-
        The request could not be served right now, and repeating it after a moment is expected to
        work. `msgId` says why: `resourceBusy` (a row the request needs is locked by another
        request, or the database picked this one as the loser of a deadlock),
        `concurrentModification` (on the protocol ports, the package-format endpoints of the main
        port and the Docker and Helm OCI endpoints, another request changed the same item at the
        same moment; the panel API answers that one with 409 `Conflict`) and
        `scanExecutorSaturated` (the vulnerability-scan queue is full). Nothing of the failed
        request was stored.
      headers:
        Retry-After:
          description: Seconds after which the request may be repeated
          schema:
            type: integer
            format: int64
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/ProblemDetail"
    Created:
      description: >-
        The resource was created. The body is the new resource and the `Location` header is the
        URL of its detail route.
      headers:
        Location:
          description: The URL of the created resource
          schema:
            type: string
            format: uri
    NoContent:
      description: >-
        The request succeeded and there is nothing to return: a delete, or an update with no
        resource to show. The body is empty.
    Accepted:
      description: >-
        The work was accepted and finishes later. The `Location` header is the URL of a status
        resource that reports the outcome.
      headers:
        Location:
          description: The URL of the status resource
          schema:
            type: string
            format: uri
  schemas:
    # region: shared
    RepoInfo:
      type: object
      properties:
        storageKey:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        diskUsage:
          type: integer
          format: int64
        privateRepo:
          type: boolean
          nullable: false
        snapshots:
          type: boolean
          nullable: false
        releases:
          type: boolean
          nullable: false
        allowOverride:
          type: boolean
          nullable: false
        securityScanEnabled:
          type: boolean
          nullable: false
          description: >-
            Whether newly pushed versions are scanned automatically. Manually triggered scans ignore
            this setting.
        type:
          "$ref": "#/components/schemas/RepoType"
    LoginInfo:
      type: object
      properties:
        username:
          type: string
        token:
          type: string
        refreshToken:
          type: string
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    ProblemDetail:
      type: object
      description: >-
        The body of every failed panel request, an RFC 9457 problem document served as
        `application/problem+json`. `code` is the stable key of the failure (the same strings the
        panel has always used as `msgId`) and the key the frontend translates. `traceId` is a unique
        id of this failure, for a bug report. Protocol routes (npm, Maven, Docker, ...) keep the
        error format of their own client and do not use it.
      required:
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: A URI that identifies the kind of problem; `about:blank` when there is none.
        title:
          type: string
          description: The HTTP reason phrase of `status`.
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated from the response.
        detail:
          type: string
          description: A human readable message for this failure.
        instance:
          type: string
          format: uri-reference
          description: The request path the failure happened on.
        code:
          type: string
          example: validationError
          description: The stable key of the failure, for example `validationError` or `repoNotFound`.
        traceId:
          type: string
          format: uuid
          description: A unique id of this failure, for a bug report.
        errors:
          type: array
          description: >-
            The fields, parameters or headers a validation failure is about. Absent on any other
            failure.
          items:
            "$ref": "#/components/schemas/ProblemField"
    ProblemField:
      type: object
      required:
        - field
        - code
      properties:
        field:
          type: string
          description: The name of the offending field, parameter or header.
        code:
          type: string
          description: The constraint that failed (for example `NotBlank`), or the failure code.
        message:
          type: string
          description: A human readable description, or absent.
    UserRole:
      type: string
      enum:
        - USER
        - ADMIN
    RepoType:
      type: string
      description: >-
        The repository format. The upper-case name is canonical: it is what the API returns. A
        request may spell it in any case (`maven` and `MAVEN` are the same type), in query
        parameters and in JSON bodies alike.
      enum:
        - MAVEN
        - NPM
        - PYPI
        - DOCKER
        - CARGO
        - NUGET
        - GOLANG
        - HELM
        - RUBY
    # region: auth
    RefreshTokenForm:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
    LoginForm:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
          minLength: 3
          pattern: "^[a-zA-Z0-9@_\\-.]+$"
        password:
          type: string
          maxLength: 72
          minLength: 1
          description: |-
            The shape only: no complexity rule applies at login, so an account whose password
            predates the creation policy, or an admin bootstrapped from a short or long
            `ADMIN_INITIAL_PASSWORD`, can log in. A wrong password of any shape answers 401
            `invalidCredentials`. At most 72 UTF-8 bytes (the BCrypt input limit): a longer one
            answers 400 `passwordTooLong`. The complexity rule stays where a password is set.
      required:
        - username
        - password
    # region: users
    UserUpdateForm:
      type: object
      properties:
        username:
          type: string
          maxLength: 25
          minLength: 3
          pattern: "^[a-z0-9_\\-]+$"
        role:
          "$ref": "#/components/schemas/UserRole"
      required:
        - username
        - role
    UserResponse:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          "$ref": "#/components/schemas/UserRole"
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          # null until the first login; keep it in the JSON as an explicit null
          x-jackson-json-include-policy: NONE
      required:
        - id
        - username
        - role
        - createdAt
        - lastLoginAt
    UserCreateForm:
      type: object
      properties:
        username:
          type: string
          maxLength: 25
          minLength: 3
          pattern: "^[a-z0-9_\\-]+$"
        password:
          type: string
          maxLength: 50
          minLength: 6
          pattern: "^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=\\S+$).+$"
        role:
          "$ref": "#/components/schemas/UserRole"
      required:
        - password
        - username
        - role
    ProtocolApiFacade: { }
    PagedModelUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/UserResponse"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    # region: profile
    UpdateUsernameForm:
      type: object
      properties:
        username:
          type: string
          maxLength: 25
          minLength: 3
          pattern: "^[a-z0-9_\\-]+$"
      required:
        - username
    PasswordForm:
      type: object
      properties:
        password:
          type: string
          maxLength: 50
          minLength: 6
          pattern: "^(?=.*\\d)(?=.*[a-z])(?=.*[A-Z])(?=\\S+$).+$"
      required:
        - password
    ProfileInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          "$ref": "#/components/schemas/UserRole"
        diskUsage:
          type: integer
          format: int64
          # ProfileService.getProfile() does not populate it yet; keep the explicit null
          x-jackson-json-include-policy: NONE
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          # null until the first login; keep it in the JSON as an explicit null
          x-jackson-json-include-policy: NONE
      required:
        - id
        - username
        - role
        - diskUsage
        - createdAt
        - lastLoginAt
    AccessTokenScope:
      type: string
      enum:
        - profile:read
        - repo:manage
        - repo:read
        - repo:write
        - scan:read
      description: >-
        What a token may do. `repo:read` downloads and reads, `repo:write` publishes (and reads),
        `repo:manage` deletes and changes settings (and writes and reads), `scan:read` reads scan
        results, `profile:read` reads who the token belongs to. Every token has `profile:read`, so
        it never has to be asked for. A token can only narrow what its owner can do: its permission
        on a repository is the owner's own permission intersected with these, and `repo:manage` is
        never implied by another scope.
    AccessTokenForm:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
        scopes:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            "$ref": "#/components/schemas/AccessTokenScope"
        expirationDate:
          type: string
          format: date-time
          description: >-
            When the token stops working. It has to be in the future and at most 365 days ahead (by
            UTC calendar day), otherwise the answer is 400 `accessTokenExpirationInPast` or
            `accessTokenExpirationTooLate`. Defaults to 365 days from now. The date is truncated to
            microseconds before it is checked and stored, so the last instant that is accepted is
            `23:59:59.999999Z` of the last day, and the date in the answer is the stored one.
      required:
        - name
        - scopes
    AccessTokenCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/AccessTokenScope"
        expirationDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: The secret. It is shown once and cannot be read again.
      required:
        - id
        - name
        - scopes
        - expirationDate
        - createdAt
        - token
    AccessTokenListItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/AccessTokenScope"
        expirationDate:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: When the token last authenticated a request. Absent if it never did.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - scopes
        - expirationDate
        - createdAt
    PagedModelAccessTokenListItem:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/AccessTokenListItem"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    AccessTokenWhoAmI:
      type: object
      properties:
        username:
          type: string
        name:
          type: string
        scopes:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/components/schemas/AccessTokenScope"
        expirationDate:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: When the token last authenticated a request. Absent if it never did.
      required:
        - username
        - name
        - scopes
        - expirationDate
    # region: repos
    RepoSettingsForm:
      type: object
      description: >-
        Settings are updated field by field: a field that is omitted (or sent as null) keeps its
        current value, so a client may send only the fields it wants to change.
      properties:
        privateRepo:
          type: boolean
          nullable: false
        allowOverride:
          type: boolean
          nullable: false
          description: >-
            When false, uploading a version that already exists is refused. Maven: a release, and a
            timestamped snapshot build, cannot be replaced, but a non-unique snapshot (the literal
            -SNAPSHOT file names that sbt and Ivy deploy every time) can always be deployed again,
            unless snapshots is false. Docker: a tag that points at a manifest cannot be moved to
            another manifest; pushing the same manifest again, or a manifest by digest, is always
            accepted. Ignored (not rejected) for Cargo and Go, which never replace a published
            version.
        releases:
          type: boolean
          nullable: false
          description: >-
            Maven and NuGet only; rejected with 400 releasesSnapshotsUnsupported for any other repo
            type. When false, uploads of release versions are refused, including redeploys of
            release versions that already exist.
        snapshots:
          type: boolean
          nullable: false
          description: >-
            Maven and NuGet only; rejected with 400 releasesSnapshotsUnsupported for any other repo
            type. When false, uploads of snapshot versions are refused, including redeploys of
            snapshot versions that already exist.
        securityScanEnabled:
          type: boolean
          nullable: false
          description: >-
            Whether newly pushed versions are scanned automatically. Manually triggered scans ignore
            this setting.
        pgpVerifyAllSignaturesEnabled:
          type: boolean
          nullable: false
          description: >-
            Maven only; rejected with 400 pgpSettingsUnsupported for any other repo type. When true,
            every artifact signature (.jar.asc, -sources.jar.asc, .module.asc, ...) is verified
            against the file it signs before it is stored, exactly like the .pom.asc, and a version
            is signed only when every file of it has a verified signature. When false (the default)
            only the .pom.asc is verified.
        pgpKeyServerLookupEnabled:
          type: boolean
          nullable: false
          description: >-
            Maven only; rejected with 400 pgpSettingsUnsupported for any other repo type. When
            false, a signature made with a key that is not registered on the repository is refused
            with 404 artifactSigningKeyNotRegistered, without asking any public key server (for
            installs that cannot reach the internet). Defaults to true.
    RepoUpdateForm:
      type: object
      description: >-
        The fields of a repository a client may change. A field that is omitted keeps its value.
      properties:
        name:
          type: string
          maxLength: 25
          minLength: 0
          pattern: "^[a-zA-Z0-9_][a-zA-Z0-9_\\-]*$"
        description:
          type: string
          maxLength: 500
          minLength: 0
    RepoListInfo:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          "$ref": "#/components/schemas/RepoType"
        privateRepo:
          type: boolean
          nullable: false
        diskUsage:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
      required:
        - name
        - createdAt
    RepoCreateRequest:
      type: object
      description: >-
        A new repository: its name, description and visibility, and its type.
      properties:
        name:
          type: string
          maxLength: 25
          minLength: 0
          pattern: "^[a-zA-Z0-9_][a-zA-Z0-9_\\-]*$"
        description:
          type: string
          maxLength: 500
        privateRepo:
          type: boolean
          nullable: false
          default: true
        type:
          "$ref": "#/components/schemas/RepoType"
      required:
        - name
        - type
    PagedModelRepoListInfo:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/RepoListInfo"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    RepoCounts:
      type: object
      description: >-
        The number of repositories per repository type, keyed by the RepoType names. All of them are
        present, with 0 for a type that has no repository.
      additionalProperties:
        type: integer
        format: int64
    RepoSettingsInfo:
      type: object
      properties:
        privateRepo:
          type: boolean
          nullable: false
        releases:
          type: boolean
          description: >-
            Maven and NuGet only; omitted for any other repo type. When false, uploads of release
            versions are refused, including redeploys of release versions that already exist.
        snapshots:
          type: boolean
          description: >-
            Maven and NuGet only; omitted for any other repo type. When false, uploads of snapshot
            versions are refused, including redeploys of snapshot versions that already exist.
        allowOverride:
          type: boolean
          description: >-
            When false, uploading a version that already exists is refused. Maven: a release, and a
            timestamped snapshot build, cannot be replaced, but a non-unique snapshot (the literal
            -SNAPSHOT file names that sbt and Ivy deploy every time) can always be deployed again,
            unless snapshots is false. Docker: a tag that points at a manifest cannot be moved to
            another manifest; pushing the same manifest again, or a manifest by digest, is always
            accepted. Omitted for Cargo and Go, which never replace a published version.
        securityScanEnabled:
          type: boolean
          nullable: false
          description: >-
            Whether newly pushed versions are scanned automatically. Manually triggered scans ignore
            this setting.
        pgpVerifyAllSignaturesEnabled:
          type: boolean
          description: >-
            Maven only; omitted for any other repo type. Whether every artifact signature is
            verified, not only the .pom.asc.
        pgpKeyServerLookupEnabled:
          type: boolean
          description: >-
            Maven only; omitted for any other repo type. Whether public key servers are asked for a
            signer's key that is not registered on the repository.
      required:
        - privateRepo
        - securityScanEnabled
    StorageItemInfo:
      type: object
      properties:
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        directory:
          type: boolean
        path:
          type: string
    # region: repo-tokens
    DeployTokenForm:
