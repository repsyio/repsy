components:
  schemas:
    NuGetDependencyInfo:
      type: object
      properties:
        packageId:
          type: string
        versionRange:
          type: string
        targetFramework:
          type: string
      required:
        - packageId
        - versionRange
    NuGetPackageListItem:
      type: object
      properties:
        packageId:
          type: string
        latestVersion:
          type: string
        description:
          type: string
        totalDownloads:
          type: integer
          format: int64
      required:
        - packageId
        - totalDownloads
    NuGetVersionListItem:
      type: object
      properties:
        version:
          type: string
        publishedAt:
          type: string
          format: date-time
        downloads:
          type: integer
          format: int64
        prerelease:
          type: boolean
          nullable: false
        listed:
          type: boolean
          nullable: false
      required:
        - version
        - publishedAt
        - downloads
        - prerelease
        - listed
    NuGetPackageInfo:
      type: object
      properties:
        packageId:
          type: string
        title:
          type: string
        description:
          type: string
        authors:
          type: string
        tags:
          type: string
        iconUrl:
          type: string
        licenseUrl:
          type: string
        projectUrl:
          type: string
        latestVersion:
          type: string
        totalDownloads:
          type: integer
          format: int64
      required:
        - packageId
        - totalDownloads
    NuGetVersionInfo:
      type: object
      properties:
        packageId:
          type: string
        version:
          type: string
        title:
          type: string
        description:
          type: string
        authors:
          type: string
        tags:
          type: string
        iconUrl:
          type: string
        licenseUrl:
          type: string
        projectUrl:
          type: string
        listed:
          type: boolean
          nullable: false
        downloadCount:
          type: integer
          format: int64
        publishedAt:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            "$ref": "#/components/schemas/NuGetDependencyInfo"
      required:
        - packageId
        - version
        - listed
        - downloadCount
        - publishedAt
    NuGetDeletedItem:
      type: string
      enum:
        - PACKAGE
        - VERSION
    RestResponseNuGetDeletedItem:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
          "$ref": "#/components/schemas/NuGetDeletedItem"
        errorCode:
          type: string
        text:
          type: string
    RestResponseNuGetPackageInfo:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
          "$ref": "#/components/schemas/NuGetPackageInfo"
        errorCode:
          type: string
        text:
          type: string
    RestResponseNuGetVersionInfo:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
          "$ref": "#/components/schemas/NuGetVersionInfo"
        errorCode:
          type: string
        text:
          type: string
    PagedModelNuGetPackageListItem:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/NuGetPackageListItem"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    RestResponsePagedModelNuGetPackageListItem:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
          "$ref": "#/components/schemas/PagedModelNuGetPackageListItem"
        errorCode:
          type: string
        text:
          type: string
    PagedModelNuGetVersionListItem:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/NuGetVersionListItem"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    RestResponsePagedModelNuGetVersionListItem:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
          "$ref": "#/components/schemas/PagedModelNuGetVersionListItem"
        errorCode:
          type: string
        text:
          type: string
    UserUpdateForm:
      type: object
      properties:
        username:
          type: string
          maxLength: 25
          minLength: 3
        role:
          "$ref": "#/components/schemas/UserRole"
      required:
        - username
        - role
    RestResponseUserResponse:
      type: object
      properties:
        msgId:
          type: string
        type:
          "$ref": "#/components/schemas/ResponseType"
        data:
