      summary: List the PGP public keys registered directly on a Maven repository's key store
      description: >-
        Registered keys are tried first when a .pom.asc is verified, then the repo's allowed
        key-server hosts, then the two public default servers. A signature whose key is nowhere
        among those is refused with 404 and nothing is stored. A 400 means the key is not one armored
        OpenPGP public key (pgpPublicKeyInvalid), or the repository already has the maximum of 20
        registered keys (pgpPublicKeyLimitReached, RPS-1796).


        Sortable by `id`, `keyId`, `fingerprint`, `userId`, `createdAt` (`property,direction`). The
        default is `id,desc`.
    post:
      tags:
        - maven-key-stores
      operationId: createMavenPgpPublicKey
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PgpPublicKeyForm"
        required: true
      security:
        - bearerAuth: []
        - personalAccessToken: []
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: >-
                The URL of the created key, `/api/mvn/key-stores/{repoName}/public-keys/{publicKeyId}`.
                Only DELETE is served there; there is no public key detail route.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PgpPublicKeyItem"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
      summary: Register an armored OpenPGP public key directly on a Maven repository's key store
