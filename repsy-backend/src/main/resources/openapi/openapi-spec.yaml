---
openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
paths:
  "/api/users/{userId}":
    put:
      tags:
        - user-controller
      operationId: updateUser
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserUpdateForm"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseUserResponse"
        '401':
          description: Missing or invalid token
        '403':
          description: Admin role required
      summary: Update a user
    delete:
      tags:
        - user-controller
      operationId: deleteUser
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RestResponseVoid"
        '401':
          description: Missing or invalid token
        '403':
          description: Admin role required
      summary: Delete a user
  "/api/repos/{repoName}/settings":
    get:
      tags:
        - protocol-repo-controller
      operationId: getSettings
