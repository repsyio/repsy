        - AFFECTED
        - NOT_AFFECTED
        - WILL_NOT_FIX
        - FIX_DEFERRED
        - END_OF_LIFE
        - UNDER_INVESTIGATION
        - UNKNOWN
    VulnerabilityScanInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        repoName:
          type: string
        repoType:
          "$ref": "#/components/schemas/RepoType"
        artifactName:
          type: string
        artifactVersion:
          type: string
        status:
          "$ref": "#/components/schemas/ScanStatus"
        highestSeverity:
          "$ref": "#/components/schemas/Severity"
        scannerName:
          type: string
          nullable: true
        scannerVersion:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    VulnerabilityFindingInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cveId:
          type: string
        severity:
          "$ref": "#/components/schemas/Severity"
        packageName:
          type: string
        packageVersion:
          type: string
        fixedVersion:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        referenceUrl:
          type: string
          nullable: true
        fixStatus:
          "$ref": "#/components/schemas/FixStatus"
        cvssScore:
          type: number
          format: double
          nullable: true
        cvssVector:
          type: string
          nullable: true
    VulnerabilityScanDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        repoName:
          type: string
        artifactName:
          type: string
        artifactVersion:
          type: string
        status:
          "$ref": "#/components/schemas/ScanStatus"
        scannerName:
          type: string
          nullable: true
        scannerVersion:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    ScanOverview:
      type: object
      properties:
        scanId:
          description: Id of the version's newest scan, of any status.
          type: string
          format: uuid
        status:
          description: Status of the version's newest scan.
          "$ref": "#/components/schemas/ScanStatus"
        scannedAt:
          description: >-
            When the version's newest scan finished; null while it is pending, queued or running.
          type: string
          format: date-time
          nullable: true
        lastCompletedAt:
          description: >-
            When the version's newest COMPLETED scan finished, the scan the counters are built
            from; null when no scan of the version has completed yet.
          type: string
          format: date-time
          nullable: true
        errorMessage:
          description: >-
            Why the version's newest scan failed, as one short line with URLs, addresses and file
            paths removed; null unless that scan has status FAILED (or no reason was recorded).
          type: string
          nullable: true
        criticalCount:
          type: integer
          format: int32
        highCount:
          type: integer
          format: int32
        mediumCount:
          type: integer
          format: int32
        lowCount:
          type: integer
          format: int32
        unknownCount:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
    RepoSecuritySummary:
      type: object
      properties:
        severity:
          "$ref": "#/components/schemas/Severity"
          nullable: true
        scanned:
          type: boolean
        rescanInProgressCount:
          description: >-
            Number of versions in the repository whose newest scan is pending, queued or running
            while an earlier scan of the same version completed, so the severity above still
            includes that version's last known result.
          type: integer
          format: int32
        rescanFailedCount:
          description: >-
            Number of versions in the repository whose newest scan failed while an earlier scan
            of the same version completed, so the severity above still includes that version's
            last known result.
          type: integer
          format: int32
        unscannedInProgressCount:
          description: >-
            Number of versions in the repository that have no completed scan yet and whose newest
            scan is pending, queued or running, so they are not part of the severity above. scanned
            stays false while none of the repository's versions has a completed scan.
          type: integer
          format: int32
        unscannedFailedCount:
          description: >-
            Number of versions in the repository that have no completed scan yet and whose newest
            scan failed, so they are not part of the severity above. scanned stays false while none
            of the repository's versions has a completed scan.
          type: integer
          format: int32
    SecuritySummary:
      type: object
      additionalProperties:
        "$ref": "#/components/schemas/RepoSecuritySummary"
    VersionSecuritySummary:
      type: object
      properties:
        severity:
          "$ref": "#/components/schemas/Severity"
          nullable: true
        findingCount:
          type: integer
          format: int32
        scanned:
          type: boolean
        latestScanStatus:
          description: >-
            Status of the version's newest scan. Severity and findingCount always describe the
            newest COMPLETED scan, so anything other than COMPLETED here means a rescan is still
            pending, queued or running, or failed, and those numbers are the last known ones. Only
            set on the per-version summary; absent on the per-artifact summary, which spans
            several versions. A version without a completed scan is listed as well, with scanned
            false, no severity, a findingCount of 0 and the status of its newest scan.
          "$ref": "#/components/schemas/ScanStatus"
          nullable: true
        rescanInProgressCount:
          description: >-
            Number of versions of the artifact whose newest scan is pending, queued or running
            while an earlier scan of the same version completed, so severity and findingCount
            still include that version's last known result. Only set on the per-artifact summary;
            absent on the per-version summary, which has latestScanStatus instead.
          type: integer
          format: int32
        rescanFailedCount:
          description: >-
            Number of versions of the artifact whose newest scan failed while an earlier scan of
            the same version completed, so severity and findingCount still include that version's
            last known result. Only set on the per-artifact summary; absent on the per-version
            summary, which has latestScanStatus instead.
          type: integer
          format: int32
        unscannedInProgressCount:
          description: >-
            Number of versions of the artifact that have no completed scan yet and whose newest
            scan is pending, queued or running, so they are not part of severity and findingCount.
            scanned stays false while none of the artifact's versions has a completed scan. Only
            set on the per-artifact summary; absent on the per-version summary, which has
            latestScanStatus instead.
          type: integer
          format: int32
        unscannedFailedCount:
          description: >-
            Number of versions of the artifact that have no completed scan yet and whose newest
            scan failed, so they are not part of severity and findingCount. scanned stays false
            while none of the artifact's versions has a completed scan. Only set on the
            per-artifact summary; absent on the per-version summary, which has latestScanStatus
            instead.
          type: integer
          format: int32
    VersionSecuritySummaryMap:
      type: object
      additionalProperties:
        "$ref": "#/components/schemas/VersionSecuritySummary"
    PagedModelVulnerabilityScanInfo:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/VulnerabilityScanInfo"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    PagedModelVulnerabilityFindingInfo:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/VulnerabilityFindingInfo"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    RecentScannedVersion:
      type: object
      properties:
        artifactName:
          type: string
        artifactVersion:
          type: string
        status:
          description: Status of the version's newest scan.
          "$ref": "#/components/schemas/ScanStatus"
        severity:
          description: >-
            Highest severity of the version's newest COMPLETED scan, so it stays the last known
            value while a rescan is pending, queued, running or failed. Null when that scan found
            nothing, or when the version has no completed scan (see lastCompletedAt).
          "$ref": "#/components/schemas/Severity"
          nullable: true
        scannedAt:
          description: When the version's newest scan, of any status, was created.
          type: string
