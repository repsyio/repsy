          nullable: false
        downloadCount:
          type: integer
          format: int64
        publishedAt:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            "$ref": "#/components/schemas/NuGetDependencyInfo"
      required:
        - packageId
        - version
        - listed
        - downloadCount
        - publishedAt
    NuGetDeletedItem:
      type: string
      enum:
        - PACKAGE
        - VERSION
    RestResponseNuGetDeletedItem:
      type: object
