spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:admin}
    password: ${SPRING_RABBITMQ_PASSWORD:admin123}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/gitnode}
    connection-timeout: 15000
    cache:
      channel:
        size: 25
        checkout-timeout: 10000
      connection:
        mode: channel

    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 10
        prefetch: 10
        default-requeue-rejected: false
        missing-queues-fatal: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-retries: 3
          multiplier: 2.0
          max-interval: 10000ms
  application:
    name: repsy-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/repsy_os
    username: admin
    password: admin123

  jpa:
    show-sql: false
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        default_schema: ${os.app.schema}

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    schemas: public
    default-schema: public

server:
  port: ${SERVER_PORT:9090}
  tomcat:
    connection-timeout: 120000
    max-part-count: 50
  forward-headers-strategy: native

multiport:
  main-port: ${server.port}
  tomcat:
    connection-timeout: ${server.tomcat.connection-timeout}
  ports:
    api: ${API_PORT:7979}
  port-aliases:
    8443: api
    9443: ""

repsy:
  ssl:
    api:
      enabled: ${API_SSL_ENABLED:false}
      port: ${API_SSL_PORT:8443}
      key-store: ${API_SSL_KEY_STORE_PATH:}
      key-store-password: ${API_SSL_KEY_STORE_PASSWORD:}
      key-store-type: ${API_SSL_KEY_STORE_TYPE:PKCS12}
      key-alias: ${API_SSL_KEY_ALIAS:repsy}
      key-password: ${API_SSL_KEY_PASSWORD:}
    repo:
      enabled: ${REPO_SSL_ENABLED:false}
      port: ${REPO_SSL_PORT:9443}
      key-store: ${REPO_SSL_KEY_STORE_PATH:}
      key-store-password: ${REPO_SSL_KEY_STORE_PASSWORD:}
      key-store-type: ${REPO_SSL_KEY_STORE_TYPE:PKCS12}
      key-alias: ${REPO_SSL_KEY_ALIAS:repsy}
      key-password: ${REPO_SSL_KEY_PASSWORD:}

logging:
  level:
    root: WARN

storage-gateway:
  fs:
    base-path: ${STORAGE_BASE_PATH:${user.home}/.repsy}
    trash-path: ${storage-gateway.fs.base-path}

admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD:Test123}

h2:
  tcp-server:
    enabled: ${H2_TCP_SERVER_ENABLED:false}
    port: ${H2_TCP_SERVER_PORT:9092}

os:
  app:
    schema: public

    storage:
      file-system:
        maven:
          base-path: ${storage-gateway.fs.base-path}/maven
          trash-path: ${storage-gateway.fs.base-path}/maven/trash
        docker:
          base-path: ${storage-gateway.fs.base-path}/docker
          trash-path: ${storage-gateway.fs.base-path}/docker/trash
        npm:
          base-path: ${storage-gateway.fs.base-path}/npm
          trash-path: ${storage-gateway.fs.base-path}/npm/trash
        pypi:
          base-path: ${storage-gateway.fs.base-path}/pypi
          trash-path: ${storage-gateway.fs.base-path}/pypi/trash
        cargo:
          base-path: ${storage-gateway.fs.base-path}/cargo
          trash-path: ${storage-gateway.fs.base-path}/cargo/trash
        golang:
          base-path: ${storage-gateway.fs.base-path}/golang
          trash-path: ${storage-gateway.fs.base-path}/golang/trash
        helm:
          base-path: ${storage-gateway.fs.base-path}/helm
          trash-path: ${storage-gateway.fs.base-path}/helm/trash
        nuget:
          base-path: ${storage-gateway.fs.base-path}/nuget
          trash-path: ${storage-gateway.fs.base-path}/nuget/trash
        ruby:
          base-path: ${storage-gateway.fs.base-path}/ruby
          trash-path: ${storage-gateway.fs.base-path}/ruby/trash
