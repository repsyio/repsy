spring:
  application:
    name: repsy-backend

  web:
    resources:
      static-locations: file:./static/

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:repsy}}
    username: ${DB_USERNAME:repsy}
    password: ${DB_PASSWORD:repsy123}

  jpa:
    show-sql: false
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        default_schema: ${os.app.schema}

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    schemas: public
    default-schema: public

  servlet:
    multipart:
      # Spring Boot's defaults are 1 MB per file and 10 MB per request, which rejects most PyPI
      # wheels and sdists, Helm charts and NuGet packages. Both limits are per request, and a
      # request carries one package, so they are set to the same value. A larger upload is answered
      # with 413 payloadTooLarge (see ErrorHandler).
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:500MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:500MB}

  task:
    execution:
      # `scanTaskExecutor` makes Spring Boot skip the default executor unless it is forced, and
      # unqualified @Async methods (usage bookkeeping, default repo seeding, ...) would then fall
      # back to an unbounded thread-per-task SimpleAsyncTaskExecutor. See AsyncTaskExecutorConfig.
      mode: force
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 30s

server:
  port: ${SERVER_PORT:9090}
  tomcat:
    connection-timeout: 120000
    max-part-count: 50
  forward-headers-strategy: native

multiport:
  main-port: ${server.port}
  tomcat:
    connection-timeout: ${server.tomcat.connection-timeout}
  ports:
    api: ${API_PORT:8080}
  port-aliases:
    8443: api
    9443: ""

repsy:
  ruby:
    # Largest gem a `gem push` may carry. The gem is the raw request body, which the multipart
    # limits above do not apply to, so a larger one is answered with 413 payloadTooLarge.
    max-gem-size: ${RUBY_MAX_GEM_SIZE:500MB}
  ssl:
    api:
      enabled: ${API_SSL_ENABLED:false}
      port: ${API_SSL_PORT:8443}
      key-store: ${API_SSL_KEY_STORE_PATH:}
      key-store-password: ${API_SSL_KEY_STORE_PASSWORD:}
      key-store-type: ${API_SSL_KEY_STORE_TYPE:PKCS12}
      key-alias: ${API_SSL_KEY_ALIAS:repsy}
      key-password: ${API_SSL_KEY_PASSWORD:}
    repo:
      enabled: ${REPO_SSL_ENABLED:false}
      port: ${REPO_SSL_PORT:9443}
      key-store: ${REPO_SSL_KEY_STORE_PATH:}
      key-store-password: ${REPO_SSL_KEY_STORE_PASSWORD:}
      key-store-type: ${REPO_SSL_KEY_STORE_TYPE:PKCS12}
      key-alias: ${REPO_SSL_KEY_ALIAS:repsy}
      key-password: ${REPO_SSL_KEY_PASSWORD:}
  security:
    # Remembers successful HTTP Basic password checks so a client that sends its credentials on
    # every request pays for one BCrypt verification, not one per request.
    basic-auth-cache:
      enabled: ${BASIC_AUTH_CACHE_ENABLED:true}
      ttl-seconds: ${BASIC_AUTH_CACHE_TTL_SECONDS:300}
      max-entries: ${BASIC_AUTH_CACHE_MAX_ENTRIES:10000}
    scanner: ${SECURITY_SCANNER:disabled}
    trivy:
      scanner-base-url: ${TRIVY_SCANNER_BASE_URL:http://localhost:8090}
      api-key: ${TRIVY_SCANNER_API_KEY:}
      request-timeout-seconds: ${TRIVY_REQUEST_TIMEOUT_SECONDS:10}
      poll-interval-ms: ${TRIVY_POLL_INTERVAL_MS:3000}
      max-scan-duration-seconds: ${TRIVY_MAX_SCAN_DURATION_SECONDS:330}
    docker:
      internal-registry-base-url: ${DOCKER_INTERNAL_REGISTRY_BASE_URL:http://localhost:9090}

  storage:
    # Deletes the Docker layer and Helm OCI blob uploads that were started and never finalized, and
    # releases the disk usage they were charged for. An upload counts as abandoned once its temp
    # file has not been written to for `ttl`. Durations are ISO-8601 (PT24H = 24 hours).
    abandoned-upload-cleanup:
      enabled: ${ABANDONED_UPLOAD_CLEANUP_ENABLED:true}
      ttl: ${ABANDONED_UPLOAD_TTL:PT24H}
      initial-delay: ${ABANDONED_UPLOAD_CLEANUP_INITIAL_DELAY:PT10M}
      interval: ${ABANDONED_UPLOAD_CLEANUP_INTERVAL:PT1H}

logging:
  level:
    root: WARN

storage-gateway:
  fs:
    base-path: ${STORAGE_BASE_PATH:${user.home}/.repsy}
    trash-path: ${storage-gateway.fs.base-path}

admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD:}

h2:
  tcp-server:
    enabled: ${H2_TCP_SERVER_ENABLED:false}
    port: ${H2_TCP_SERVER_PORT:9092}

os:
  app:
    schema: public

    storage:
      file-system:
        maven:
          base-path: ${storage-gateway.fs.base-path}/maven
          trash-path: ${storage-gateway.fs.base-path}/maven/trash
        docker:
          base-path: ${storage-gateway.fs.base-path}/docker
          trash-path: ${storage-gateway.fs.base-path}/docker/trash
        npm:
          base-path: ${storage-gateway.fs.base-path}/npm
          trash-path: ${storage-gateway.fs.base-path}/npm/trash
        pypi:
          base-path: ${storage-gateway.fs.base-path}/pypi
          trash-path: ${storage-gateway.fs.base-path}/pypi/trash
        cargo:
          base-path: ${storage-gateway.fs.base-path}/cargo
          trash-path: ${storage-gateway.fs.base-path}/cargo/trash
        golang:
          base-path: ${storage-gateway.fs.base-path}/golang
          trash-path: ${storage-gateway.fs.base-path}/golang/trash
        helm:
          base-path: ${storage-gateway.fs.base-path}/helm
          trash-path: ${storage-gateway.fs.base-path}/helm/trash
        nuget:
          base-path: ${storage-gateway.fs.base-path}/nuget
          trash-path: ${storage-gateway.fs.base-path}/nuget/trash
        ruby:
          base-path: ${storage-gateway.fs.base-path}/ruby
          trash-path: ${storage-gateway.fs.base-path}/ruby/trash
