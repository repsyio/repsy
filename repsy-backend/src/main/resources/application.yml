spring:
  application:
    name: repsy-backend

  web:
    resources:
      static-locations: file:./static/

  # DB_HOST/DB_PORT/DB_DATABASE are deliberately not read here: they were undocumented nested
  # defaults inside DB_URL's own default, so setting only one of them (e.g. DB_HOST alone) once the
  # Docker image gained its own DB_URL default (RPS-1173) would have silently switched the image to
  # H2 instead of PostgreSQL, with no error. A flat default removes that trap. Set DB_URL directly
  # to point at a different host/port/database. LegacyDatabaseVariablesWarning logs a WARN at startup
  # when any of them is still set (RPS-1423).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repsy}
    username: ${DB_USERNAME:repsy}
    password: ${DB_PASSWORD:repsy123}

  jpa:
    show-sql: false
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        default_schema: ${os.app.schema}

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    schemas: public
    default-schema: public

  servlet:
    multipart:
      # Spring Boot's defaults are 1 MB per file and 10 MB per request, which rejects most PyPI
      # wheels and sdists, Helm charts and NuGet packages. Both limits are per request, and a
      # request carries one package, so they are set to the same value. A larger upload is answered
      # with 413 payloadTooLarge (see ErrorHandler).
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:500MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:500MB}

  task:
    execution:
      # `scanTaskExecutor` makes Spring Boot skip the default executor unless it is forced, and
      # unqualified @Async methods (usage bookkeeping, default repo seeding, ...) would then fall
      # back to an unbounded thread-per-task SimpleAsyncTaskExecutor. See AsyncTaskExecutorConfig.
      mode: force
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 500
      shutdown:
        await-termination: true
        await-termination-period: 30s

server:
  port: ${SERVER_PORT:9090}
  tomcat:
    connection-timeout: 120000
    max-part-count: 50
  forward-headers-strategy: native
  # The npm packument of a package with many versions is megabytes of JSON, and a client asks for
  # it on every install (RPS-1359). Only JSON is compressed, and only what is worth the effort; the
  # tarballs, blobs and other files of the protocols are never touched. This applies to the main
  # (protocol) port; the panel port is served uncompressed. SERVER_COMPRESSION_ENABLED=false turns
  # it off, for a reverse proxy that compresses already.
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    mime-types: application/json,application/vnd.npm.install-v1+json
    min-response-size: 1KB

multiport:
  main-port: ${server.port}
  tomcat:
    connection-timeout: ${server.tomcat.connection-timeout}
  ports:
    api: ${API_PORT:8080}
  port-aliases:
    8443: api
    9443: ""

repsy:
  npm:
    # The address the npm registry names itself with in the `dist.tarball` of every version it serves
    # or stores, e.g. https://repo.example.com (a path prefix is fine). Empty (the default) derives it
    # from each request (Host and X-Forwarded-* headers). Set it when a reverse proxy strips a path
    # prefix or cannot send those headers, so that clients fetch tarballs from where they found the
    # registry (RPS-1333). It is the REPO_BASE_URL of the web UI's config snippets.
    public-url: ${REPO_BASE_URL:}
  nuget:
    # The address the NuGet service index, registration and search name their URLs with, e.g.
    # https://repo.example.com (a path prefix is fine): every `@id` of /v3/index.json, the
    # registration leaves, the `packageContent` .nupkg URLs and the search `registration` URLs start
    # with it followed by the repo name. Empty (the default) derives it from each request (Host and
    # X-Forwarded-* headers). Set it when a reverse proxy strips a path prefix or cannot send those
    # headers, so that `dotnet` follows URLs it can reach (RPS-1432). It is the REPO_BASE_URL of the
    # web UI's config snippets, like repsy.npm.public-url.
    public-url: ${REPO_BASE_URL:}
  golang:
    # Largest module zip a `go` client may publish. The zip is the raw request body, which the
    # multipart limits above do not apply to, so a larger one is answered with 413 payloadTooLarge.
    # 500MB matches MaxZipFile in golang.org/x/mod/zip, the limit the go tool itself puts on a
    # module zip, so no zip the toolchain would build or accept is ever refused by it (RPS-1119).
    max-module-zip-size: ${GO_MAX_MODULE_ZIP_SIZE:500MB}
  ruby:
    # Largest gem a `gem push` may carry. The gem is the raw request body, which the multipart
    # limits above do not apply to, so a larger one is answered with 413 payloadTooLarge.
    max-gem-size: ${RUBY_MAX_GEM_SIZE:500MB}
  cargo:
    # Largest .crate a `cargo publish` may carry. Its length is a field inside Cargo's own wire
    # format rather than an HTTP header, so it is checked as soon as that field is read, before the
    # crate itself is spooled to disk; a larger one is answered with a Cargo-shaped 413. crates.io
    # itself defaults to 10MB, tuned for its own storage costs across the whole public registry;
    # Repsy is self-hosted, so an operator publishing larger internal crates (vendored native
    # libraries, generated bindings) can raise this without a rebuild (RPS-1119).
    max-crate-size: ${CARGO_MAX_CRATE_SIZE:100MB}
  maven:
    # A Maven repo that verifies every signature accepts a signature before the file it signs (Maven
    # uploads in parallel) and holds it, unverified and not served, until that file arrives. What is
    # older than `ttl` is deleted every `purge-interval`. Durations are ISO-8601 (PT24H = 24 hours).
    pending-signature:
      enabled: ${PENDING_SIGNATURE_PURGE_ENABLED:true}
      ttl: ${PENDING_SIGNATURE_TTL:PT24H}
      purge-interval: ${PENDING_SIGNATURE_PURGE_INTERVAL:PT15M}

  ssl:
    api:
      enabled: ${API_SSL_ENABLED:false}
      port: ${API_SSL_PORT:8443}
      key-store: ${API_SSL_KEY_STORE_PATH:}
      key-store-password: ${API_SSL_KEY_STORE_PASSWORD:}
      key-store-type: ${API_SSL_KEY_STORE_TYPE:PKCS12}
      key-alias: ${API_SSL_KEY_ALIAS:repsy}
      key-password: ${API_SSL_KEY_PASSWORD:}
    repo:
      enabled: ${REPO_SSL_ENABLED:false}
      port: ${REPO_SSL_PORT:9443}
      key-store: ${REPO_SSL_KEY_STORE_PATH:}
      key-store-password: ${REPO_SSL_KEY_STORE_PASSWORD:}
      key-store-type: ${REPO_SSL_KEY_STORE_TYPE:PKCS12}
      key-alias: ${REPO_SSL_KEY_ALIAS:repsy}
      key-password: ${REPO_SSL_KEY_PASSWORD:}
  security:
    # Remembers successful HTTP Basic password checks so a client that sends its credentials on
    # every request pays for one BCrypt verification, not one per request.
    basic-auth-cache:
      enabled: ${BASIC_AUTH_CACHE_ENABLED:true}
      ttl-seconds: ${BASIC_AUTH_CACHE_TTL_SECONDS:300}
      max-entries: ${BASIC_AUTH_CACHE_MAX_ENTRIES:10000}
    # Limits the failed password checks (HTTP Basic and panel login) of one client, so wrong
    # credentials cannot keep the CPU busy with BCrypt. The client is the remote address, which
    # behind a reverse proxy is the X-Forwarded-For entry of a trusted proxy.
    auth-throttle:
      enabled: ${AUTH_THROTTLE_ENABLED:true}
      max-failures: ${AUTH_THROTTLE_MAX_FAILURES:20}
      window-seconds: ${AUTH_THROTTLE_WINDOW_SECONDS:60}
      max-clients: ${AUTH_THROTTLE_MAX_CLIENTS:10000}
    # Resets a user's password when an operator creates a file named after the user in `dir`
    # (README "Forgot admin password?"). The file is removed and the new password is logged once.
    # The Docker image points `dir` at /app/data/password-reset, on the persisted volume.
    password-reset:
      enabled: ${PASSWORD_RESET_MARKER_ENABLED:true}
      dir: ${PASSWORD_RESET_MARKER_DIR:${storage-gateway.fs.base-path}/password-reset}
      poll-interval: ${PASSWORD_RESET_MARKER_POLL_INTERVAL:PT5S}
    scanner: ${SECURITY_SCANNER:disabled}
    trivy:
      scanner-base-url: ${TRIVY_SCANNER_BASE_URL:http://localhost:8090}
      api-key: ${TRIVY_SCANNER_API_KEY:}
      request-timeout-seconds: ${TRIVY_REQUEST_TIMEOUT_SECONDS:10}
      poll-interval-ms: ${TRIVY_POLL_INTERVAL_MS:3000}
      max-scan-duration-seconds: ${TRIVY_MAX_SCAN_DURATION_SECONDS:330}
      # A submit that cannot reach the scanner (restart, cold start, upgrade) is retried after
      # min(initial * 4^(n-1), max) seconds; attempts counts the first submit (1 = no retry).
      submit-max-attempts: ${TRIVY_SUBMIT_MAX_ATTEMPTS:3}
      submit-retry-initial-delay-seconds: ${TRIVY_SUBMIT_RETRY_INITIAL_DELAY_SECONDS:15}
      submit-retry-max-delay-seconds: ${TRIVY_SUBMIT_RETRY_MAX_DELAY_SECONDS:60}
    docker:
      internal-registry-base-url: ${DOCKER_INTERNAL_REGISTRY_BASE_URL:http://localhost:9090}

  # Renames the manifest files an earlier version stored under a name generated from the tag to
  # manifests/<digest> and fills in the sha512 digest of those manifests (RPS-1216). Until it has run
  # the registry reads the legacy names, so switching it off only delays the cleanup. Durations are
  # ISO-8601.
  docker:
    manifest-layout-repair:
      enabled: ${DOCKER_MANIFEST_LAYOUT_REPAIR_ENABLED:true}
      initial-delay: ${DOCKER_MANIFEST_LAYOUT_REPAIR_INITIAL_DELAY:PT10M}
      interval: ${DOCKER_MANIFEST_LAYOUT_REPAIR_INTERVAL:PT24H}

  storage:
    # Deletes the Docker layer and Helm OCI blob uploads that were started and never finalized, and
    # releases the disk usage they were charged for. An upload counts as abandoned once its temp
    # file has not been written to for `ttl`. Durations are ISO-8601 (PT24H = 24 hours).
    abandoned-upload-cleanup:
      enabled: ${ABANDONED_UPLOAD_CLEANUP_ENABLED:true}
      ttl: ${ABANDONED_UPLOAD_TTL:PT24H}
      initial-delay: ${ABANDONED_UPLOAD_CLEANUP_INITIAL_DELAY:PT10M}
      interval: ${ABANDONED_UPLOAD_CLEANUP_INTERVAL:PT1H}
    # Removes for good what was deleted from the filesystem storage. A deleted repo, package or
    # version is first moved into the `trash` directory of its protocol; this job deletes the trash
    # older than `os.app.storage.file-system.trash-retention` (at least P1D, or the application does
    # not start). The first run after an upgrade deletes the whole backlog older than that.
    trash-cleanup:
      enabled: ${TRASH_CLEANUP_ENABLED:true}
      initial-delay: ${TRASH_CLEANUP_INITIAL_DELAY:PT15M}
      interval: ${TRASH_CLEANUP_INTERVAL:PT24H}

logging:
  level:
    root: WARN

storage-gateway:
  fs:
    base-path: ${STORAGE_BASE_PATH:${user.home}/.repsy}
    trash-path: ${storage-gateway.fs.base-path}

admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD:}

app:
  # Origins the panel API accepts cross-origin, credentialed requests from. Empty (the default) means
  # same-origin only: no CORS header at all (RPS-1590), which is what the Docker image needs (the SPA
  # and the API share an origin). Comma-separated, exact origins only (e.g. https://panel.example.com),
  # for a SPA served from elsewhere. `mvn spring-boot:run` sets http://localhost:4200 through
  # application-dev.yml. See CorsGlobalConfiguration.
  # The repository-serving (protocol) port sends no CORS header at all (RPS-1514).
  allowed-origins: ${APP_ALLOWED_ORIGINS:}

  # Strict-Transport-Security max-age in seconds (SecurityHeadersFilter). 0 (the default) never
  # sends the header. When positive it is sent only on a secure request (TLS listener, or a proxy
  # that forwards X-Forwarded-Proto: https). HSTS is per host, not per port: with plain :8080 and
  # TLS :8443 on one host, enabling it would make browsers upgrade http://host:8080, so it is
  # opt-in for TLS-only deployments (a reverse proxy normally owns it).
  hsts-max-age: ${APP_HSTS_MAX_AGE:0}

  csp:
    # Sends a Content-Security-Policy header (SecurityHeadersFilter) with the panel SPA and its
    # static assets, so a sanitiser bypass or a future [innerHTML] use has a second barrier.
    enabled: ${APP_CSP_ENABLED:true}
    # Send Content-Security-Policy-Report-Only instead of the enforcing header: violations are
    # reported, nothing is blocked. Useful while rolling a widened/custom policy out.
    report-only: ${APP_CSP_REPORT_ONLY:false}
    # Overrides the built-in policy outright. Unset keeps the built-in policy (see
    # SecurityHeadersFilter), which allows the panel's own origin only (RPS-1402: no third-party
    # host) plus whatever app.allowed-origins allows for connect-src.
    policy: ${APP_CSP_POLICY:}

h2:
  tcp-server:
    enabled: ${H2_TCP_SERVER_ENABLED:false}
    port: ${H2_TCP_SERVER_PORT:9092}

os:
  app:
    schema: public

    storage:
      file-system:
        trash-retention: ${TRASH_RETENTION:P7D}
        maven:
          base-path: ${storage-gateway.fs.base-path}/maven
          trash-path: ${storage-gateway.fs.base-path}/maven/trash
        docker:
          base-path: ${storage-gateway.fs.base-path}/docker
          trash-path: ${storage-gateway.fs.base-path}/docker/trash
        npm:
          base-path: ${storage-gateway.fs.base-path}/npm
          trash-path: ${storage-gateway.fs.base-path}/npm/trash
        pypi:
          base-path: ${storage-gateway.fs.base-path}/pypi
          trash-path: ${storage-gateway.fs.base-path}/pypi/trash
        cargo:
          base-path: ${storage-gateway.fs.base-path}/cargo
          trash-path: ${storage-gateway.fs.base-path}/cargo/trash
        golang:
          base-path: ${storage-gateway.fs.base-path}/golang
          trash-path: ${storage-gateway.fs.base-path}/golang/trash
        helm:
          base-path: ${storage-gateway.fs.base-path}/helm
          trash-path: ${storage-gateway.fs.base-path}/helm/trash
        nuget:
          base-path: ${storage-gateway.fs.base-path}/nuget
          trash-path: ${storage-gateway.fs.base-path}/nuget/trash
        ruby:
          base-path: ${storage-gateway.fs.base-path}/ruby
          trash-path: ${storage-gateway.fs.base-path}/ruby/trash
