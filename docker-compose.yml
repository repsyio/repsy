# Local/manual test stack for repsy-os with security scanning enabled.
# Extends the "Option 3: Docker Compose with PostgreSQL" setup from README.md with the
# repsy-scanner-trivy service. Copy .env.example to .env before running:
#   cp .env.example .env
#   docker compose up -d --build
#
# Supports two topologies:
#
#   (a) Full compose — every service (postgres, repsy, repsy-scanner-trivy) runs in this
#       compose stack. Uncomment the "repsy" service below and use its commented-out env
#       block as-is (DOCKER_INTERNAL_REGISTRY_BASE_URL=http://repsy:9090, service-name-based
#       DNS resolution on repsy-network).
#
#   (b) Hybrid (backend on host) — the common day-to-day dev setup: repsy-backend runs from
#       the IDE / `mvn spring-boot:run` directly on the host, and only postgres +
#       repsy-scanner-trivy run in this compose stack (leave the "repsy" service commented
#       out). The host-run backend needs its own env vars set directly (not through this
#       file), pointing at this stack's published ports:
#         DB_URL=jdbc:postgresql://localhost:5432/repsy
#         SECURITY_SCANNER=enabled
#         TRIVY_SCANNER_BASE_URL=http://localhost:8090
#         TRIVY_SCANNER_API_KEY=<same value as this file's TRIVY_SCANNER_API_KEY/.env>
#         DOCKER_INTERNAL_REGISTRY_BASE_URL=http://host.docker.internal:9090
#       The last one only resolves from inside repsy-scanner-trivy because of this file's
#       extra_hosts entry below — without it, Linux Docker does not auto-map
#       host.docker.internal the way Docker Desktop does on macOS/Windows.

services:
  postgres:
    container_name: repsy-postgres
    hostname: repsy-postgres
    image: postgres:18
    environment:
      - POSTGRES_DB=repsy
      - POSTGRES_USER=repsy
      - POSTGRES_PASSWORD=repsy123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repsy -d repsy"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - repsy-network

#  repsy:
#    container_name: repsy
#    image: repo.repsy.io/repsy/os/repsy:latest
#    depends_on:
#      # Plain "container started" isn't enough here — confirmed by testing: repsy's first
#      # connection attempt raced Postgres's own startup and failed with UnknownHostException
#      # before Postgres was actually accepting connections. Gate on the healthcheck instead.
#      postgres:
#        condition: service_healthy
#      repsy-scanner-trivy:
#        condition: service_healthy
#    ports:
#      - "8080:8080"
#      - "9090:9090"
#    environment:
#      - DB_URL=jdbc:postgresql://repsy-postgres:5432/repsy
#      - DB_USERNAME=repsy
#      - DB_PASSWORD=repsy123
#      - ADMIN_INITIAL_PASSWORD=YourSecurePassword123
#      - SECURITY_SCANNER=enabled
#      - TRIVY_SCANNER_BASE_URL=http://repsy-scanner-trivy:8090
#      - TRIVY_SCANNER_API_KEY=${TRIVY_SCANNER_API_KEY:-changeme-trivy-api-key}
#      # Only correct for topology (a), full compose, where "repsy" resolves via this
#      # stack's own service-name DNS. For topology (b), hybrid/host-backend, this must
#      # instead be http://host.docker.internal:9090 — see the topology note at the top
#      # of this file.
#      - DOCKER_INTERNAL_REGISTRY_BASE_URL=http://repsy:9090
#    networks:
#      - repsy-network

  repsy-scanner-trivy:
    container_name: repsy-scanner-trivy
    hostname: repsy-scanner-trivy
    build:
      context: ./repsy-scanner-trivy
      dockerfile: Dockerfile
    # Not published to a registry yet (no CI/CD pipeline for it) — must be built locally.
    environment:
      - SCANNER_API_KEY=${TRIVY_SCANNER_API_KEY:-changeme-trivy-api-key}
      # This is the scanner's own property (scanner.trivy.gate-acquire-timeout-seconds), not a
      # repsy-backend one — it bounds how long a queued scan request waits to acquire the
      # single-trivy-execution gate. Raised well above the 60s default: the container's Trivy
      # vulnerability DB cache is empty on first boot, so the very first scan after a (re)start
      # has to download the full DB before it can run, which can easily exceed 60s depending on
      # network speed — any scan requests queued behind that cold-start download would otherwise
      # time out waiting for the gate, even though the scanner itself is healthy and working.
      - TRIVY_GATE_ACQUIRE_TIMEOUT_SECONDS=180
    # Published (not just exposed) so a host-run backend (topology (b)) can reach this at
    # http://localhost:8090 — other containers on repsy-network can still reach it by
    # service name/port regardless, so this doesn't take anything away from topology (a).
    ports:
      - "8090:8090"
    # Lets this container reach back out to a host-run backend's registry port (topology
    # (b), DOCKER_INTERNAL_REGISTRY_BASE_URL=http://host.docker.internal:9090) — required on
    # Linux, where host.docker.internal isn't resolved automatically the way it is on Docker
    # Desktop (macOS/Windows). No effect on topology (a), which never references this host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persists Trivy's vulnerability DB cache across container restarts so it isn't
      # re-downloaded from scratch every time (partial mitigation for the cold-start gate
      # timeout risk noted above). Path verified directly against the trivy binary baked into
      # this image (`trivy --help | grep cache-dir` -> default "/home/appuser/.cache/trivy") —
      # the scanner doesn't itself set --cache-dir/TRIVY_CACHE_DIR, so this matches Trivy's own
      # default under the Dockerfile's non-root "appuser". The Dockerfile pre-creates this
      # directory with appuser ownership before USER appuser, which Docker then carries over to
      # this named volume's mount point on first mount — without that, the mount point defaults
      # to root-owned and appuser can't write into it (verified: this broke cache writes before
      # the Dockerfile fix).
      - trivy-cache:/home/appuser/.cache/trivy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - repsy-network

networks:
  repsy-network:
    driver: bridge

volumes:
  trivy-cache:
